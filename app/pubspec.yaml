name: zaghlol
description: Zaghlol - on-device personal finance for Egypt.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  # T-007 / ADR-002: encrypted SQLite (SQLite3MultipleCiphers via the root
  # pubspec's hook user_define). T-016: drift code is generated by the
  # standalone tools/drift_codegen (drift_dev can't resolve in this workspace;
  # app/tool/generate_drift.sh). Keep drift there at the locked version.
  drift: ^2.35.3
  sqlite3: ^3.9.0
  # T-015 / ADR-001: state and DI (plain providers; riverpod_generator lands
  # with the first feature that needs code generation).
  flutter_riverpod: ^3.0.0
  # T-023 / ADR-017: gen-l10n and date formats.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  # T-016: the application support directory for zaghlol.db (first-party).
  path_provider: ^2.1.6
  # T-015: SafeException for code-only DB errors (error-handling §3).
  zaghlol_domain:
    path: ../packages/zaghlol_domain
  # T-030: the seed format and its ES256 check (pure Dart).
  zaghlol_catalog:
    path: ../packages/zaghlol_catalog
  # T-008: the ingestion engines parse with the T-033 pipeline.
  zaghlol_parsing:
    path: ../packages/zaghlol_parsing
  # T-008: raw_messages.body_hash (SHA-256; dart-lang, already in the lock).
  crypto: ^3.0.6
  # T-148 (ADR-011 amendment, architecture §7): backup AES-256-GCM and HKDF.
  # cryptography_flutter swaps in the OS AES-GCM (javax.crypto / CryptoKit) on
  # Android and iOS; host tests use the pure-Dart fallback. Exact pins (C4).
  cryptography: 2.9.0
  cryptography_flutter: 2.3.4
  # T-148: Argon2id for the backup passphrase (pure Dart, no FFI, no network).
  hashlib: 2.4.2
  # T-141: ES256 verification of backend response signatures (pure Dart, the
  # same library zaghlol_catalog uses; already in the workspace lock).
  pointycastle: ^4.0.0
  go_router: ^18.1.4
  googleapis: ^19.0.0
  http: ^1.6.0
  google_sign_in: 7.2.0
  fl_chart: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # T-007: on-device contract and benchmark (app/integration_test/). Never
  # imported from lib/ (guarded in app-ci).
  integration_test:
    sdk: flutter
  pigeon: ^26.0.0
  # T-141: the OpenAPI drift test reads backend/openapi/zaghlol-v1.yaml.
  yaml: ^3.1.0
  plugin_platform_interface: ^2.1.8

flutter:
  generate: true
  uses-material-design: true
  assets:
    # T-030: the signed first-launch catalog (tools/catalog_build).
    - assets/catalog/
    # T-053: static Captain Zaghlol still (fallback until zaghlol.riv, T-088).
    - assets/mascot/
