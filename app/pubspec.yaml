name: zaghlol
description: Zaghlol - on-device personal finance for Egypt.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  # T-007 / ADR-002: encrypted SQLite (SQLite3MultipleCiphers via the root
  # pubspec's hook user_define). T-016: drift code is generated by the
  # standalone tools/drift_codegen (drift_dev can't resolve in this workspace;
  # app/tool/generate_drift.sh). Keep drift there at the locked version.
  drift: ^2.35.3
  sqlite3: ^3.9.0
  # T-015 / ADR-001: state and DI (plain providers; riverpod_generator lands
  # with the first feature that needs code generation).
  flutter_riverpod: ^3.0.0
  # T-016: the application support directory for zaghlol.db (first-party).
  path_provider: ^2.1.6
  # T-015: SafeException for code-only DB errors (error-handling §3).
  zaghlol_domain:
    path: ../packages/zaghlol_domain

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # T-007: on-device contract and benchmark (app/integration_test/). Never
  # imported from lib/ (guarded in app-ci).
  integration_test:
    sdk: flutter
  pigeon: ^26.0.0

flutter:
  uses-material-design: true
