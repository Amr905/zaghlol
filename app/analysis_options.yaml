# T-002 / FU-029: the app takes the shared workspace rules (flutter_lints, the
# strict analyzer modes, the extra linter rules and the riverpod_lint analyzer
# plugin) from ../analysis_options.yaml. Analyzer plugins are only read from the
# workspace root, and a package's own options file only sees them through an
# `include` of that root file. Do not turn this back into an `include` of
# flutter_lints. The zaghlol_lints rules run through
# tools/lints/bin/zaghlol_lints.dart (see .github/workflows/README.md).
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
include: ../analysis_options.yaml
