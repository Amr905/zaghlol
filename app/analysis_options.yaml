# The app uses flutter_lints (T-002, review follow-up F11). A file can have only
# one `include`, so the shared workspace rules from ../analysis_options.yaml are
# repeated here; keep both in sync. The generated-file excludes are kept (F13).
# riverpod_lint and the zaghlol_lints rules run through `dart run custom_lint`
# (see .github/workflows/README.md), not through `flutter analyze`.
include: package:flutter_lints/flutter.yaml

analyzer:
  plugins:
    - custom_lint
  errors:
    # custom_lint still uses the legacy plugin system; see tools/lints/README.md.
    analysis_options_deprecated_plugins: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated/**"
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
