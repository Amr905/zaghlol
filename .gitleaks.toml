# T-175 M-1: gitleaks configuration. Extends the default rules; allow-lists ONLY the dev-only
# values documented in docs/05-reviews/T-175-pass1.md §1.2 (each is refused outside Development/Testing
# or in release builds) and synthetic test vectors. Do not add production paths here.
title = "zaghlol gitleaks"

[extend]
useDefault = true

[allowlist]
description = "dev-only values and synthetic test vectors (T-175 pass 1 §1.2)"
paths = [
  '''tools/catalog_build/dev/dev_signing_key\.json''',
  '''backend/deploy/db/dev-passwords\.sql''',
  '''backend/docker-compose(\.[a-z-]+)?\.yml''',
  '''docs/qa/tools/run_backend_local\.sh''',
  '''docs/qa/tools/api_db_followup\.py''',
  # Synthetic test vectors / example values that trip generic-api-key or jwt (T-192: named files, not whole test trees).
  '''^backend/openapi/zaghlol\-v1\.yaml$''',
  '''^backend/tests/Zaghlol\.Contract\.Tests/vectors/jws\-es256\-v1\.json$''',
  '''^backend/tests/Zaghlol\.Contract\.Tests/vectors/seat\-key\-hash\-v1\.json$''',
  '''^backend/tests/Zaghlol\.Contract\.Tests/vectors/restore\-binding\-v1\.json$''',
  '''^backend/tests/Zaghlol\.Infrastructure\.Tests/Observability/ZaghlolJsonFormatterTests\.cs$''',
  '''^backend/tests/Zaghlol\.Infrastructure\.Tests/Observability/SensitiveTests\.cs$''',
  '''^backend/tests/Zaghlol\.Infrastructure\.Tests/Kms/FileKeyToolTests\.cs$''',
  '''^backend/tests/Zaghlol\.Infrastructure\.Tests/Installs/InstallStoreTests\.cs$''',
  '''^backend/tests/Zaghlol\.Ops\.Tests/TokenStoreTests\.cs$''',
  '''^backend/tests/Zaghlol\.Contract\.Tests/SeatProofVectorTests\.cs$''',
  '''^backend/tests/Zaghlol\.Contract\.Tests/AccountsLiveContractTests\.cs$''',
  '''^backend/tests/Zaghlol\.Application\.Tests/Purchases/PlayNotificationIngestTests\.cs$''',
  '''^backend/tests/Zaghlol\.Api\.Tests/FaultInjectionStartupFilter\.cs$''',
  '''^backend/tests/Zaghlol\.Api\.Tests/ApiTests\.cs$''',
  '''^backend/tests/Zaghlol\.Api\.Tests/Accounts/AppleCallbackTests\.cs$''',
  '''^backend/tests/Zaghlol\.Api\.Tests/Accounts/AccountsHostFixture\.cs$''',
  '''^app/test/features/security/application/delete_everything_test\.dart$''',
  '''^app/test/core/logging/diag_log_test\.dart$''',
  '''^app/test/core/backend/backend_client_test\.dart$''',
  '''^app/ios/RunnerTests/SeatKeyTests\.swift$''',
  '''^app/android/gradle/verification-metadata\.xml$''',
  '''^pubspec\.lock$''',
  '''^tools/drift_codegen/pubspec\.lock$''',
  '''^backend/openapi/package-lock\.json$''',
]
regexes = [
  '''[A-Za-z_]*_dev_only''',
]
