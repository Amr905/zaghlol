# Local development stack: `tools/dev-keys.sh && docker compose up --build` then `curl http://localhost:8080/v1/health`.
# The API runs as Development with the Local KMS over the throwaway keys in .dev-keys/ (T-123); it refuses to start
# without them, and the Local provider is refused outside Development/Testing.
# All passwords below are throwaway local-development values (deploy/db/dev-passwords.sql); real secrets come from the
# secrets manager. Roles: deploy/db/bootstrap-roles.sql runs once when the volume is first initialised.
name: zaghlol-backend

x-backend-image: &backend-image
  build:
    context: .
    dockerfile: Dockerfile
  image: zaghlol-backend:local

services:
  postgres:
    image: postgres:17
    # FU-025: no DETAIL/HINT in server logs ("Failing row contains (...)" would log row values on a CHECK failure).
    command: ["postgres", "-c", "log_error_verbosity=terse"]
    environment:
      POSTGRES_DB: zaghlol
      POSTGRES_USER: zaghlol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zaghlol_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db/bootstrap-roles.sql:/docker-entrypoint-initdb.d/10-bootstrap-roles.sql:ro
      - ./deploy/db/dev-passwords.sql:/docker-entrypoint-initdb.d/20-dev-passwords.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaghlol -d zaghlol"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # One-shot migration job (same image as the worker), as the schema-owning `migrator` login.
  migrate:
    <<: *backend-image
    entrypoint: ["dotnet", "/app/worker/Zaghlol.Workers.dll", "--migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Migrator: Host=postgres;Port=5432;Database=zaghlol;Username=migrator;Password=migrator_dev_only
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  api:
    <<: *backend-image
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__App: Host=postgres;Port=5432;Database=zaghlol;Username=zaghlol_api;Password=api_dev_only
      ConnectionStrings__Admin: Host=postgres;Port=5432;Database=zaghlol;Username=zaghlol_admin;Password=admin_dev_only
    # Kms:* and Signing:Keys for the Local provider, written by tools/dev-keys.sh.
    env_file:
      - ./.dev-keys/kms.env
    volumes:
      - ./.dev-keys:/run/zaghlol-dev-keys:ro
    ports:
      - "${API_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "dotnet", "/app/api/Zaghlol.Api.dll", "--healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  worker:
    <<: *backend-image
    entrypoint: ["dotnet", "/app/worker/Zaghlol.Workers.dll"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Worker: Host=postgres;Port=5432;Database=zaghlol;Username=zaghlol_worker;Password=worker_dev_only
      Worker__HeartbeatFile: /tmp/zaghlol-worker.heartbeat
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "dotnet", "/app/worker/Zaghlol.Workers.dll", "--healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
