openapi: 3.1.0
info:
  title: Zaghlol backend API
  version: 1.0.0
  summary: Non-financial services for the Zaghlol app (purchases, catalog sync, prices, flags, accounts).
  description: |
    Source of truth for the v1 wire contract, written from `docs/03-technical/backend-api.md`
    (sections 1 to 6). When the two differ, fix the document and this file together; the contract tests in
    `backend/tests/Zaghlol.Contract.Tests` fail if they drift.

    **Privacy rule (SRS BR-SYNC-03).** The backend accepts only the fields listed in this file. Every request
    schema that Zaghlol defines (app and operator calls) is closed (`additionalProperties: false`) and the
    server answers `400 UNKNOWN_FIELD` to any other field. There is no field for messages, transactions,
    amounts, balances, budgets, assets or user rules, and none may be added without a requirements change.

    **Third-party bodies are open.** Bodies whose shape Google or Apple define (the Pub/Sub push envelope, the
    App Store Server Notifications V2 body and Apple's `form_post` to the Android sign-in callback) are marked
    `x-third-party-body: true`. Their schemas are open (`additionalProperties: true`): the server reads only
    the listed fields and ignores, never stores and never logs any other field, so a store-side addition can
    not cause rejected notifications or retry storms. No app or operator operation may carry this marker.

    **Conventions.**
    - Responses are open: clients must ignore unknown response fields (additive changes within v1).
    - Money and prices are decimal strings (`DecimalString`) with an ISO 4217 currency, never JSON numbers.
    - Timestamps are RFC 3339 in UTC with a `Z` suffix (`UtcTimestamp`).
    - Errors are `application/problem+json` (RFC 9457) with a stable `code` (see `ProblemCode`). Error bodies
      never echo request data. Besides the errors listed per operation, any endpoint can answer the generic
      `404 NOT_FOUND`, `405 METHOD_NOT_ALLOWED`, `413 PAYLOAD_TOO_LARGE` and `415 UNSUPPORTED_MEDIA_TYPE`.
    - Signed responses carry `Zaghlol-Signature`, an ES256 signature over the exact response body bytes after
      decompression. The app drops unsigned or invalid bodies.
    - Request size is at most 64 KB, except `/v1/notifications/*` (256 KB).
    - No operation takes personal data or tokens in the query string. The server never logs query strings,
      raw paths or `Location` headers; logs carry the route template only.
  contact:
    name: Zaghlol backend team
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.zaghlol.app
    description: Production
  - url: https://api.staging.zaghlol.app
    description: Staging
tags:
  - name: Health
    description: Liveness and readiness.
  - name: Installs
    description: Anonymous install registration and deletion.
  - name: Sync
    description: The daily catalog, flags, prices and entitlement sync.
  - name: Catalog
    description: Full signed catalog snapshots.
  - name: Purchases
    description: Server-side store purchase verification and restore.
  - name: Entitlement
    description: Signed Gold entitlement.
  - name: Accounts
    description: Optional Google or Apple sign-in used only to carry Gold across devices.
  - name: Notifications
    description: Store server-to-server notifications (Google RTDN, App Store Server Notifications V2).
  - name: Admin
    description: Operator API. Requires an operator OIDC token with MFA and a role. Not used by the app.

paths:
  /v1/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness and readiness
      description: |
        Unauthenticated. Never cached. Readiness: the server runs a trivial database query as the API's own
        least-privilege role (1 s timeout; the answer is cached for 2 s, so calls never load the database). While the
        database is unreachable the answer is `503 UPSTREAM_UNAVAILABLE`. Orchestrators use this for readiness only;
        liveness is a process-level check.
      responses:
        '200':
          description: The service is up.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                serverTime: '2026-11-03T18:22:01Z'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /v1/installs:
    post:
      tags: [Installs]
      operationId: registerInstall
      summary: Register an install and get an install token
      description: |
        Called lazily on the first sync or first purchase. If `installId` already exists the server answers
        `409 INSTALL_EXISTS` and the client regenerates the ID (only happens after an interrupted delete).
        Rate limited per /24 IP. A retry with the same `Idempotency-Key` and the same body within 24 hours, before
        the install has made any authenticated call, returns `201` with a freshly generated `installToken` (the
        unused earlier token stops working); no response holding a token is ever stored. After the first
        authenticated call, after 24 hours, or with another key, the answer is `409 INSTALL_EXISTS` and the
        client registers a new install ID (R3-6). The same key with a different body is `409 IDEMPOTENCY_KEY_REUSED`.
      parameters:
        - $ref: '#/components/parameters/ZaghlolApp'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallRequest'
            example:
              installId: 0193f2c4-7a10-4c52-9d3e-5b1f8a2c6e77
              platform: android
              appVersion: 1.0.0
      responses:
        '201':
          description: Install registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallResponse'
              example:
                installToken: q3VqY0xvYm5kQ3V0ZVBpZ2VvblRva2VuMTIzNDU2Nzg
                serverTime: '2026-11-03T18:22:01Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/InstallConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/installs/me:
    delete:
      tags: [Installs]
      operationId: deleteInstall
      summary: Delete this install (Delete everything)
      description: |
        Tombstones the install; its tokens stop working at once. The app wipes local data before calling this
        and does not depend on it succeeding.
      security:
        - installToken: []
      parameters:
        - $ref: '#/components/parameters/ZaghlolApp'
        - $ref: '#/components/parameters/ZaghlolInstall'
      responses:
        '202':
          description: Accepted. No body.
        '401':
          $ref: '#/components/responses/InstallTokenInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/sync:
    post:
      tags: [Sync]
      operationId: sync
      summary: Daily sync (catalog delta, flags, prices, entitlement, outbox upload)
      description: |
        At most one effective sync per install per 24 hours, by the server clock; a call inside the window returns
        200 with only `serverTime`, `nextSyncNotBefore` and `timeNonce`, and writes nothing. Unchanged blocks are
        `null` so an up-to-date response stays under 2 KB. `mode: full` is returned when `catalogVersion` is 0,
        ahead of the server, more than 20 versions behind, or the delta is too large. Every 200 is signed.
        `contributions` are sent only if the user opted in (D-16) and the server silently drops any that fail
        BR-SYNC-04; `accepted` counts the rows actually stored. A catalog, flags or entitlement read failure is
        503 with nothing written (the window is not consumed). No `Idempotency-Key`: the throttle makes a repeat safe.
      security:
        - installToken: []
        - installToken: []
          accountToken: []
      parameters:
        - $ref: '#/components/parameters/ZaghlolApp'
        - $ref: '#/components/parameters/ZaghlolInstall'
        - $ref: '#/components/parameters/ZaghlolTimeNonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
            example:
              catalogVersion: 41
              flagsVersion: 7
              pricesAsOf: '2026-11-02T09:00:00Z'
              entitlementIssuedAt: '2026-10-30T10:00:00Z'
              registryVersion: 12
              contributions:
                - merchantNorm: koshary el tahrir
                  institutionCode: nbe
                  categoryCode: dining
              bankRequests:
                - institutionName: Banque du Caire
                  country: EG
                  channel: sms
      responses:
        '200':
          description: Sync result (signed).
          headers:
            Zaghlol-Signature:
              $ref: '#/components/headers/ZaghlolSignature'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
              examples:
                throttled:
                  summary: Inside the 24 h window
                  value:
                    serverTime: '2026-11-03T18:22:02Z'
                    nextSyncNotBefore: '2026-11-04T18:22:02Z'
                    timeNonce: kq3V9w0bQ2FwdGFpblphZw
                changed:
                  summary: Delta with flags and prices
                  value:
                    serverTime: '2026-11-03T18:22:02Z'
                    nextSyncNotBefore: '2026-11-04T18:22:02Z'
                    catalog:
                      fromVersion: 41
                      toVersion: 43
                      mode: delta
                      fullUrl: null
                      ops:
                        - t: merchant
                          op: upsert
                          id: 812
                          canonical: Koshary El Tahrir
                          nameAr: كشري التحرير
                          category: dining
                        - t: alias
                          op: delete
                          merchantId: 77
                          alias: old alias
                    flags:
                      version: 8
                      values:
                        zakah: false
                        smart_roi: false
                    prices:
                      asOf: '2026-11-03T15:00:00Z'
                      stale: false
                      gold:
                        - symbol: XAU24_G
                          currency: EGP
                          price: '4820.00'
                      fx:
                        base: USD
                        rates:
                          EGP: '48.9500'
                    entitlement: null
                    accepted:
                      contributions: 1
                      bankRequests: 1
                    accountToken: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InstallTokenInvalidOrAccountExpired'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /v1/catalog/{version}/full:
    get:
      tags: [Catalog]
      operationId: getFullCatalog
      summary: Full signed catalog snapshot
      description: |
        Served from the CDN. Used on first sync or when the client is far behind. The body is signed; the
        signature is the `Zaghlol-Signature` header and also the `.sig` file stored next to the snapshot.
        The client verifies it before applying.
      parameters:
        - name: version
          in: path
          required: true
          description: 'Immutable catalog version to fetch, as announced by a `mode: full` sync response.'
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: The snapshot (signed).
          headers:
            Zaghlol-Signature:
              $ref: '#/components/headers/ZaghlolSignature'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSnapshot'
        '404':
          $ref: '#/components/responses/CatalogVersionUnknown'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/purchases/verify:
    post:
      tags: [Purchases]
      operationId: verifyPurchase
      summary: Verify a new purchase, acknowledge it and return the entitlement
      description: |
        Android sends the product ID and the Play purchase token; iOS sends the StoreKit 2 signed transaction
        (JWS). On Android the product ID selects the Play endpoint (`purchases.subscriptionsv2.get` for
        subscriptions, `purchases.productsv2.getproductpurchasev2` for lifetime) and must equal the product ID
        Play returns for the token. The server verifies with the store, checks the store-side binding
        (Play `obfuscatedExternalAccountId`, Apple `appAccountToken`) equals `StoreBindingRef(installId)` of the
        install the token authenticates (backend-api §4.3; vectors
        `backend/tests/Zaghlol.Contract.Tests/vectors/store-binding-v1.json`), upserts keyed by purchase token
        (Android) or originalTransactionId (iOS), acknowledges Android purchases, and grants Gold only for a
        purchased and active state (a cancelled subscription keeps Gold until its expiry). A pending purchase
        returns `status: pending` and grants nothing. A `purchaseToken` that isn't 1-512 characters of
        `[A-Za-z0-9._-]` (with at least one letter or digit) is answered `422 PURCHASE_TOKEN_INVALID` without a
        Play call. A store failure is `502 STORE_UNAVAILABLE` and an exhausted server-side store budget
        `503 UPSTREAM_UNAVAILABLE`, both with `Retry-After` and neither stored. Idempotent for 24 hours per
        `Idempotency-Key`.
        No device attestation here: the store-side binding to StoreBindingRef(installId) already ties a new purchase to
        the buying install (ADR-012 Amendment (2026-11-05) Part B). Verify binds the purchase's single seat to the
        buying install when the purchase has no seat yet (not a move, D-52). A **new payment from this install**
        (a Google `linkedPurchaseToken` successor, or a new Apple transaction with `transactionReason = PURCHASE`)
        for a seat another install holds moves the seat here and counts as the move when no cooldown is running
        (D-59); inside the cooldown the seat stays on the holder and the response has `seatHeldElsewhere: true`
        and `nextMoveAt` (D-61(a)). For an account-linked purchase the move also needs a valid account token for
        that account on this request; without it the seat stays and the response adds `accountRequired: true`
        (R4-4). The payment is verified and acknowledged in every case and is never refused
        because of the seat. iOS may send `seatKeys` (this install's Secure Enclave seat key, D-55).
        A replay with the same `Idempotency-Key` but a different body is `409 IDEMPOTENCY_KEY_REUSED`.
      security:
        - installToken: []
        - installToken: []
          accountToken: []
      parameters:
        - $ref: '#/components/parameters/ZaghlolApp'
        - $ref: '#/components/parameters/ZaghlolInstall'
        - $ref: '#/components/parameters/ZaghlolTimeNonce'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseVerifyRequest'
            example:
              platform: android
              productId: zaghlol_gold_yearly
              purchaseToken: opaque-token-from-play
      responses:
        '200':
          description: Verification result (signed).
          headers:
            Zaghlol-Signature:
              $ref: '#/components/headers/ZaghlolSignature'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseVerifyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InstallTokenInvalidOrAccountExpired'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '422':
          $ref: '#/components/responses/PurchaseRejected'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/StoreUnavailable'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /v1/purchases/restore:
    post:
      tags: [Purchases]
      operationId: restorePurchases
      summary: Re-verify store purchases on a new phone
      description: |
        Runs the verify procedure for each purchase (Android `{productId, purchaseToken}` items, iOS signed
        transactions), without the store-side install-binding check, which names the old install after a
        phone change. Possession of a genuine token is **not** proof of ownership (FR-GOLD-02, D-46, D-52).
        Instead:

        - **Strict JSON and install binding (R2-1, R2-6, R3-8).** The body is parsed once; duplicate member names
          at any depth (also inside `purchases[]` items and `attestation`) and lone UTF-16 surrogates are
          `400 VALIDATION_FAILED`; duplicate rejection is configured explicitly (`AllowDuplicateProperties = false`). The proof is bound to
          `bodyHash = SHA-256("zaghlol-restore-v1" || 0x00 || installId || 0x00 || JCS(body without attestation))`
          (RFC 8785), where `installId` is the lower-case UUID text of the install that the install token
          authenticates, never a body field or header. JCS is computed over the same parsed object the handler
          binds. Shared vectors: `backend/tests/Zaghlol.Contract.Tests/vectors/restore-binding-v1.json`.
        - **Device attestation (FR-GOLD-09, D-53; BR-SYNC-03 amended, D-45).** `attestation` is required on
          every restore. Android sends a Play Integrity standard-request token with `requestHash = b64u(bodyHash)`;
          iOS sends an App Attest assertion over `clientDataHash`, which covers `bodyHash` and the seat public keys
          (R4-1(3); see `AppAttestProof`), plus, on a new key's first use, an `attestationObject` over the same
          hash, which registers the key to this install only. A missing,
          invalid, replayed or unbound proof, or a Play token older than 5 minutes, fails the whole call with
          `422 DEVICE_ATTESTATION_FAILED`. Optional Play verdicts are ignored. A Play verdict with only
          `MEETS_BASIC_INTEGRITY` may hold the seat with entitlement `exp` at most 2 days (6-day window). An
          attestation-service outage is `503`, never `422`. There is no server challenge. iOS adds
          `attestation.seatKeys` (D-55), Secure Enclave seat-key proofs over the same hash.
        - **One seat (FR-GOLD-08, BR-GOLD-07).** Each purchase has exactly one seat, on Android or iOS. A restore
          by the current holder is never a move, and neither is a same-iPhone rebind proven by a seat key at
          position 1 or later of `seatKeys`, whose element 0 must be this install's registered key (D-55, R4-1(1)),
          at most 2 per purchase per rolling 30 days (D-63). Over that cap the seat still passes to the caller but
          the 30-day window restarts (D-65(a)).
          Otherwise the seat moves to the caller only if `now >= next_move_at` (`movedFromOtherPhone: true`);
          the move sets `next_move_at` to 30 days later rounded up to the whole UTC hour. The old holder gets a
          `status: moved` token at its next refresh and, offline, loses Gold within 7 days (D-60, trusted time).
          If no item ends `active` or `pending` and at least one was refused for the cooldown, the call is
          `409 MOVE_COOLDOWN` with `nextMoveAt`; nothing that affects Gold is written and the caller becomes
          one of up to 3 pending claimants (7 days). On Android a reinstall is a new install, so its restore is
          a move.
        - **Account-linked purchases (FR-GOLD-08e, D-61(c))** move to, or are granted on, only an install signed
          in to that account (send the account token), the holder included; otherwise the item's outcome is
          `account_required`. Restore never changes `account_id`.

        Per-item outcomes fold into the aggregate `status` (precedence active > pending > account_required >
        expired > refunded > invalid). The only 422 is `DEVICE_ATTESTATION_FAILED` and the only 409 is
        `MOVE_COOLDOWN`.

        **Abuse limits.** Restore has its own rate-limit bucket (5 calls per hour per install, on top of the
        general per-install and per-/24 buckets) and a per-purchase limit keyed by SHA-256 of the token or
        `originalTransactionId` (10 restore attempts per day across all installs). Store calls draw on a
        global Play / App Store call budget in which verify and the acknowledge sweeper have priority; when
        the budget is short, restore answers `503 UPSTREAM_UNAVAILABLE` with `Retry-After`.
      security:
        - installToken: []
        - installToken: []
          accountToken: []
      parameters:
        - $ref: '#/components/parameters/ZaghlolApp'
        - $ref: '#/components/parameters/ZaghlolInstall'
        - $ref: '#/components/parameters/ZaghlolTimeNonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseRestoreRequest'
            example:
              platform: android
              purchases:
                - productId: zaghlol_gold_lifetime
                  purchaseToken: opaque-token-from-play
              attestation:
                type: play_integrity
                token: eyJhbGciOiJBMjU2S1ciLCJlbmMiOiJBMjU2R0NNIn0.ZW5jcnlwdGVkLWtleQ.aXY.Y2lwaGVydGV4dA.dGFn
      responses:
        '200':
          description: Restore result (signed).
          headers:
            Zaghlol-Signature:
              $ref: '#/components/headers/ZaghlolSignature'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRestoreResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InstallTokenInvalidOrAccountExpired'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          $ref: '#/components/responses/MoveCooldown'
        '422':
          $ref: '#/components/responses/DeviceAttestationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/StoreUnavailable'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /v1/entitlement:
    get:
      tags: [Entitlement]
      operationId: getEntitlement
      summary: Fetch a fresh signed entitlement
      description: |
        Covers the purchases whose seat this install holds; account-linked purchases only with a valid account
        token for their account, otherwise they are `paused` (D-61(c)). Called after a restore, after sign-in,
        and whenever the app runs online with a cached token at least 12 hours old (D-60). Never moves a seat;
        an install that lost a seat gets `status: moved` with `movedBy`.
      security:
        - installToken: []
        - installToken: []
          accountToken: []
      parameters:
        - $ref: '#/components/parameters/ZaghlolApp'
        - $ref: '#/components/parameters/ZaghlolInstall'
        - $ref: '#/components/parameters/ZaghlolTimeNonce'
      responses:
        '200':
          description: The entitlement (signed).
          headers:
            Zaghlol-Signature:
              $ref: '#/components/headers/ZaghlolSignature'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InstallTokenInvalidOrAccountExpired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/accounts/signin:
    post:
      tags: [Accounts]
      operationId: signIn
      summary: Verify a Google or Apple ID token, link this install, return the account token
      description: |
        Links the install. Attaches to the account only purchases bought on this install (D-54, FR-ACCT-05);
        after attach the seat must be on an install linked to the account, or it returns to the buying install:
        once per purchase without the cooldown (free reclaim, D-58), which still restarts the 30-day window
        (D-61(b)). Then moves the seat of each account-linked purchase to this install under the 30-day
        cooldown (D-52, FR-GOLD-07), or rebinds it without the cooldown when `seatKeys` proves the same iPhone
        (D-55), at most 2 times per purchase per rolling 30 days (D-63). Over the cap the seat still passes and the
        window restarts when the seat's key is trusted (D-65(a)); otherwise it is an ordinary move and the response
        sets `restoreSuggested`. A move refused for the cooldown never undoes the link: the call still returns 200 with
        `moveRefused: true` and `nextMoveAt` (R3-5). The nonce's single-use record is committed before and
        outside that transaction. If the install is linked to a different account the server
        answers `409 INSTALL_LINKED_TO_OTHER_ACCOUNT`; resend with `replaceLink: true` to confirm. For Apple the `authorizationCode` is exchanged for a refresh token that is stored encrypted
        and used only to revoke on deletion. Idempotent for 24 hours per `Idempotency-Key`.

        Replay protection (ADR-016 amendment 2). The app sends the **raw** client nonce (at least 128 bits,
        base64url); the provider saw only `hex(SHA-256(raw))`, the lower-case hex SHA-256 of the raw nonce's
        ASCII bytes. The server recomputes that value and compares it with the token's `nonce` claim in
        constant time, so a copied claim does not pass. A token whose `iat` is more than 10 minutes old is
        rejected (`422 ID_TOKEN_INVALID`). The nonce is required for both providers (ADR-016 amendment 3); a
        token without a `nonce` claim is rejected. Every accepted token is single-use: the server stores the
        hash of its nonce until the token's `exp`, and a second use is rejected. An `Idempotency-Key` replay
        returns the stored result only to the same install for an identical body; a different body is
        `409 IDEMPOTENCY_KEY_REUSED`.
      security:
        - installToken: []
      parameters:
        - $ref: '#/components/parameters/ZaghlolApp'
        - $ref: '#/components/parameters/ZaghlolInstall'
        - $ref: '#/components/parameters/ZaghlolTimeNonce'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
