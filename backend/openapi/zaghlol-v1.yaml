  /admin/v1/support/seat:move:
    post:
      tags: [Admin]
      operationId: adminMoveSeat
      summary: Move a purchase's Gold seat past the 30-day cooldown, optionally link it (audited)
      description: |
        Role `support_agent` with phishing-resistant MFA (D-52, D-54, D-56, D-57, EC-68, FR-ACCT-05, FR-BE-08/11;
        backend-api.md section 5.3). One agent may act. First checks `ownershipCheck`, the store order ID, live
        with Google Play (`orders.get`) or the App Store Server API (Look Up Order ID); a mismatch or a refunded
        order is `422 OWNERSHIP_CHECK_FAILED`, an outage `503`. The order ID is never stored or logged.
        `toInstallId` must be one of the purchase's pending claimants (up to 3, refused only by the cooldown in
        the last 7 days), or, for `attachToAccount` alone, the current holder, or, for `reasonCode: correction`,
        the `from_install` of the support move named by `correctsAuditId` (move back). The account rule applies.
        `attachToAccount` needs an unlinked purchase, a target linked to an account and a buying install that is
        gone or unseen for at least 30 days; otherwise `409 ADMIN_CONFLICT`. A move restarts the 30-day window
        (`nextMoveAt` = 30 days later, rounded up to the whole UTC hour), and the losing install gets
        `status: moved` with `movedBy: support`. Moving to the current holder changes nothing. **Dispute freeze
        (D-64):** for 30 days after a correction on the purchase (each correction restarts it), any call with a
        `reasonCode` other than `correction` is `409 ADMIN_CONFLICT`, checked before the ownership check and
        audited (`outcome: dispute_frozen`); a support lead, other than that correction's agent, can end the
        freeze early with `adminUnfreezePurchase`. A support attach makes the buying install, if it reappears, get a
        one-time notice (`supportNotice`). Every call writes
        one audit row (`support_seat_move`: purchase, from and to install, reason code, ticket reference,
        ownership-check outcome, corrected row, outcome; never an e-mail, an order ID or free text), deleted
        exactly 1 year after creation. Interim client: `zaghlol-ops support move`.
      x-required-roles: [support_agent]
      security:
        - operatorOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportSeatMoveRequest'
            example:
              purchaseId: 0193f2c4-7a10-7c52-9d3e-5b1f8a2c6e01
              toInstallId: 0193f2c4-7a10-4c52-9d3e-5b1f8a2c6e77
              reasonCode: lost_or_broken_phone
              ticketRef: ZG-10422
              ownershipCheck: GPA.3312-5208-4571-04923
      responses:
        '200':
          description: The seat after the call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportSeatMoveResult'
              example:
                purchaseId: 0193f2c4-7a10-7c52-9d3e-5b1f8a2c6e01
                moved: true
                attached: false
                nextMoveAt: '2026-12-06T10:00:00Z'
                auditId: 48211
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedGeneric'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AdminConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/OwnershipCheckFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /admin/v1/support/purchase:detach:
    post:
      tags: [Admin]
      operationId: adminDetachPurchase
      summary: Remove an account link that support made (audited correction)
      description: |
        Role `support_agent` with phishing-resistant MFA (D-57(e), FR-BE-08/11; backend-api.md section 5.3).
        Reverses a support attach: `correctsAuditId` must name the `support_seat_move` row that attached the
        purchase's current account, and the link must have been made by support (a link made from the buying
        phone can't be detached); otherwise `409 ADMIN_CONFLICT`. Checks `ownershipCheck` live like
        `adminMoveSeat`. Sets the purchase's account to none and leaves the seat where it is; re-linking is a
        `seat:move` with `attachToAccount`. A detach is a correction: it is allowed during a dispute freeze and
        restarts it (D-64). Writes one `support_detach` audit row that references the corrected
        row (never an e-mail, an order ID or free text), deleted exactly 1 year after creation.
      x-required-roles: [support_agent]
      security:
        - operatorOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportDetachRequest'
            example:
              purchaseId: 0193f2c4-7a10-7c52-9d3e-5b1f8a2c6e01
              reasonCode: correction
              ticketRef: ZG-10431
              ownershipCheck: GPA.3312-5208-4571-04923
              correctsAuditId: 48211
      responses:
        '200':
          description: The purchase's link after the call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportDetachResult'
              example:
                purchaseId: 0193f2c4-7a10-7c52-9d3e-5b1f8a2c6e01
                detached: true
                auditId: 48230
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedGeneric'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AdminConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/OwnershipCheckFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /admin/v1/support/purchase:unfreeze:
    post:
      tags: [Admin]
      operationId: adminUnfreezePurchase
      summary: End a purchase's dispute freeze early (support lead, audited, moves nothing)
      description: |
        Role `support_lead` with phishing-resistant MFA (R5-5(b), D-64, D-65(b), FR-BE-08/11; backend-api.md
        section 5.3). Clears the purchase's dispute freeze so that an ordinary support move can follow, for an
        owner who lost the phone during the freeze. It moves no seat, links no account and leaves the 30-day
        window as it is. The caller must be a different operator from the agent of the correction that started
        the current freeze; otherwise `409 ADMIN_CONFLICT`, checked before the ownership check and audited.
        Checks `ownershipCheck` live like `adminMoveSeat` (`422 OWNERSHIP_CHECK_FAILED`, `503` on an outage).
        A purchase with no running freeze changes nothing and is audited as `noop`. Every call writes one
        `support_unfreeze` audit row (purchase, ticket reference, the correction row that started the freeze,
        ownership-check outcome, outcome; never an e-mail, an order ID or free text), deleted exactly 1 year
        after creation, and raises the `support_unfreeze` alert. Not idempotency-keyed (idempotent by nature).
        Interim client: `zaghlol-ops support unfreeze`.
      x-required-roles: [support_lead]
      security:
        - operatorOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportUnfreezeRequest'
            example:
              purchaseId: 0193f2c4-7a10-7c52-9d3e-5b1f8a2c6e01
              ticketRef: ZG-10457
              ownershipCheck: GPA.3312-5208-4571-04923
      responses:
        '200':
          description: The purchase's freeze state after the call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportUnfreezeResult'
              example:
                purchaseId: 0193f2c4-7a10-7c52-9d3e-5b1f8a2c6e01
                unfrozen: true
                auditId: 48247
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedGeneric'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AdminConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/OwnershipCheckFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

