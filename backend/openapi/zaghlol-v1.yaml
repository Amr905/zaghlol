        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Admin]
      operationId: adminDeleteCatalogDraftEntry
      summary: Tombstone one draft catalog entry
      description: |
        Role `catalog_editor`. Audited. Marks the entry deleted in the draft; the next publish emits it as an
        `op: delete` tombstone in deltas (ADR-013). An entry that was never published is removed outright.
        Deleting a merchant also tombstones its aliases, and the delta lists those alias tombstones before the
        merchant tombstone. Deleting a category that a live category, merchant or keyword still references
        answers `409 ADMIN_CONFLICT`. Deleting a missing or already tombstoned entry answers `404`.
      x-required-roles: [catalog_editor]
      security:
        - operatorOidc: []
      parameters:
        - $ref: '#/components/parameters/CatalogEntity'
        - $ref: '#/components/parameters/CatalogEntryKey'
      responses:
        '204':
          description: Tombstoned. No body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedGeneric'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AdminConflict'
        '429':
