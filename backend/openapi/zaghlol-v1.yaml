  /v1/apple/android-callback:
    post:
      tags: [Accounts]
      operationId: appleAndroidCallback
      summary: Sign in with Apple web-flow callback for Android
      description: |
        The Android web flow authorizes with `response_type=code id_token`, `response_mode=form_post`,
        `scope=email` and a `nonce`, so Apple POSTs the result here as `application/x-www-form-urlencoded`
        (Apple allows `id_token` and scopes only with `fragment` or `form_post`). Tokens therefore never
        appear in an HTTP URL. The endpoint is a stateless bounce: it checks that `state` is present and well
        formed, stores nothing, and answers `303` to an Android `intent://` URL for the app's package, which
        the browser hands to the app on the device without any network request. The app compares `state`
        with the value it generated and then calls `POST /v1/accounts/signin`, which verifies the ID token and
        nonce. Apple's `user` field (name, e-mail) and any field not listed are ignored, never forwarded,
        never stored and never logged. The request body and the `Location` header are never logged.

        **Location construction (no injection).** Every forwarded value must first match its pattern
        (`code`, `id_token`, `state`, `error`), otherwise `400`. The URL is then built with a URI builder from
        constants only (scheme `intent`, host `callback`, the configured package and the
        `signinwithapple` scheme), with each forwarded value added as a percent-encoded query parameter.
        Raw input is never concatenated. Test requirement (T-135): for each field, inputs containing `#`, `;`,
        `%23`, CR/LF and `&` either get a `400` or yield a `Location` with exactly one
        `#Intent;package=<applicationId>;scheme=signinwithapple;end` tail and no extra parameter.
      x-third-party-body: true
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppleCallbackForm'
            example:
              code: c1a0b2d3e4f5
              id_token: eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiIxIn0.c2ln
              state: 01JC8ZQ4V7M2X9K3B5N6P8R0TA
      responses:
        '303':
          description: Redirect to the app carrying the sign-in result.
          headers:
            Location:
              description: |
                `intent://callback?<code, id_token, state or error>#Intent;package=<applicationId>;scheme=signinwithapple;end`
                (the format the `sign_in_with_apple` package expects). Never logged.
              schema:
                type: string
                maxLength: 12288
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/notifications/google:
    post:
      tags: [Notifications]
      operationId: ingestGoogleNotification
      summary: Google Play RTDN ingest (Pub/Sub push)
      description: |
        Authenticated with a Google-signed OIDC token (audience and service account pinned). Never accepts
        install or account tokens. Stores the message (deduplicated on `messageId`) and answers 204
        immediately; a worker re-reads the authoritative state from the Play API. The envelope is Google's
        Pub/Sub push format and is open: fields Google adds later are ignored, never stored and never logged.
        Request size limit is 256 KB.

        **Order of checks.** The authentication handler verifies the OIDC JWT **before the body is read**:
        signature (Google JWKS), `iss` (`https://accounts.google.com` or `accounts.google.com`), `aud` equal
        to the pinned push audience, `email` equal to the push service account, `email_verified = true`, and
        `exp`. On failure it answers `401` without buffering the body. Only then is the body bound to a DTO
        with exactly the listed fields (no `[JsonExtensionData]` or `JsonElement` catch-all), `message.data`
        is decoded, and the extracted columns are written to `store_notifications`. The raw envelope is never
        stored.
      x-third-party-body: true
      security:
        - googlePubSubOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleNotificationRequest'
            example:
              message:
                data: eyJ2ZXJzaW9uIjoiMS4wIn0=
                messageId: '136969346945'
                publishTime: '2026-11-03T18:22:01.000Z'
              subscription: projects/zaghlol/subscriptions/rtdn-push
      responses:
        '204':
          description: Stored. Pub/Sub treats any 2xx as an ack.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedGeneric'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/notifications/apple:
    post:
      tags: [Notifications]
      operationId: ingestAppleNotification
      summary: App Store Server Notifications V2 ingest
      description: |
        Authenticated by the JWS signature inside `signedPayload` (x5c chain verified to Apple Root CA G3,
        bundle ID and environment checked). Used for both the production and sandbox URLs. Deduplicated on
        `notificationUUID`. Answers 200 after storing; Apple retries otherwise. The body is open: fields Apple
        adds later are ignored, never stored and never logged. Request size limit is 256 KB.

        **Order of checks.** Only `signedPayload` is read (DTO with that one field, no catch-all). The server
        verifies the x5c chain to Apple Root CA G3 and the ES256 signature, then `bundleId` and `environment`,
        then the nested `signedTransactionInfo` / `signedRenewalInfo` JWS the same way. Nothing is written
        before all of these pass; a failure answers `401`. Then the extracted columns are written to
        `store_notifications`. The raw body is never stored.
      x-third-party-body: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleNotificationRequest'
            example:
              signedPayload: eyJhbGciOiJFUzI1NiJ9.eyJub3RpZmljYXRpb25UeXBlIjoiU1VCU0NSSUJFRCJ9.c2ln
      responses:
        '200':
          description: Stored. No body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedGeneric'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

