  /admin/v1/catalog/draft/{entity}/{id}:
    put:
      tags: [Admin]
      operationId: adminPutCatalogDraftEntry
      summary: Create or replace one draft catalog entry
      description: |
        Role `catalog_editor`. Audited. The key is in the path (`CatalogEntryKey`) and the body carries only
        the non-key fields, so a key change is a `DELETE` plus a `PUT`. Categories, aliases and keywords are
        created or replaced; merchants must already exist (create them with `POST`), otherwise `404`. A `PUT`
        on a tombstoned entry revives it. Answers `409 ADMIN_CONFLICT` when a referenced category or merchant
        is not live in the draft.
      x-required-roles: [catalog_editor]
      security:
        - operatorOidc: []
      parameters:
        - $ref: '#/components/parameters/CatalogEntity'
        - $ref: '#/components/parameters/CatalogEntryKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogDraftEntryRequest'
            example:
              canonical: Koshary El Tahrir
              nameAr: كشري التحرير
              category: dining
      responses:
        '200':
          description: The stored draft entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogOp'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedGeneric'
        '403':
