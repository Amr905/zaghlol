  /admin/v1/support/entitlement:lookup:
    post:
      tags: [Admin]
      operationId: adminLookupEntitlement
      summary: Look up an entitlement status
      description: |
        Role `support_viewer`. The body holds exactly one of `installId` or `email`; neither ever appears in a
        URL, so neither reaches access logs, proxies or CDN logs. Returns entitlement and seat status only
        (per related purchase: its UUID, plan, state, whether the looked-up install holds the seat or is the
        pending claimant, account-linked or not, and the cooldown dates); there is no endpoint that lists
        installs, and no tokens or other installs' IDs are returned. Audited: the audit row stores the install ID, or
        `HMAC-SHA256(K_audit, NFC(trim(lower(email))))` with a dedicated KMS key, plus the matched
        `account_id`; never the e-mail itself. The row is deleted exactly 1 year after creation (D-47,
        FR-BE-11). Not idempotency-keyed (read-only).
      x-required-roles: [support_viewer]
      security:
        - operatorOidc: []
      requestBody:
