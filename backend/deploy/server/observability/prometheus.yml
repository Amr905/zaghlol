# Local Prometheus: scrapes the OTel collector (the apps push OTLP; the collector exposes Prometheus text on :8889),
# evaluates the repository's alert rules and sends firing alerts to Alertmanager (e-mail).
# The capacity and database rules in alerts/platform.yaml use container and Postgres exporter metrics that this
# local stack doesn't run: they stay inactive (no data) until a node/cAdvisor exporter is added.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: zaghlol-otel
    static_configs:
      - targets: ["otel-collector:8889"]
