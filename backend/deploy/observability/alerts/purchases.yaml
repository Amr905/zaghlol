# Purchases, store notifications, prices, catalog, sync size and signing (error-handling-and-observability.md section 4).
groups:
  - name: zaghlol-purchases
    rules:
      - alert: ZaghlolPurchaseUnackedOver48h
        # Recomputed by the acknowledge sweeper every 15 minutes over ackable rows (T-130).
        expr: max(zaghlol_purchase_unacked{age="ge_48h"}) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "A purchase has been unacknowledged for more than 48 hours"
          description: "Google Play refunds unacknowledged purchases after 3 days. Check the sweeper run log and the Play API outcome counters."

      - alert: ZaghlolAuditPurchaseUnacked48h
        expr: sum(increase(zaghlol_audit_alert_fired_total{rule="purchase_unacked_48h"}[30m])) > 0
        labels:
          severity: page
        annotations:
          summary: "The acknowledge sweeper found a purchase unacknowledged for 48 hours or more"
          description: "Look up the purchase by its UUID; acknowledge it before Google refunds it at 72 hours (BR-GOLD-06)."
          log_query: 'msg="audit_alert" rule="purchase_unacked_48h" (carries the purchase UUID)'

      - alert: ZaghlolStoreAuthError
        # 401/403 from the Play Developer API or the App Store Server API: our credential or its permissions are wrong, never the
        # user's fault (T-130, T-131).
        expr: sum by (store, api) (increase(zaghlol_store_call_total{outcome="auth_error"}[10m])) > 0
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.store }} API calls are refused with 401/403 ({{ $labels.api }})"
          description: "Verify answers 502 and Gold purchases stay pending. google_play: check the Google service identity (workload identity or the key in the secrets manager) and its Play Console permissions. app_store: check the In-App Purchase key (issuer ID, key ID, private key in the secrets manager) and that it was not revoked in App Store Connect."

      - alert: ZaghlolAppleSignedAnswerInvalid
        # T-131: a JWS that Apple's own API returned failed verification, or contradicted the app's copy (outcome="payload").
        # Never the user's fault: a wrong pinned root, an Apple change, or something between us and Apple.
        expr: sum by (outcome) (increase(zaghlol_purchase_jws_total{source="api", outcome!="ok"}[10m])) > 0
        labels:
          severity: page
        annotations:
          summary: "An App Store Server API answer failed verification ({{ $labels.outcome }})"
          description: "Verify answers 502 for the affected purchases and grants nothing. Check the pinned Apple Root CA - G3, Apple's developer news for certificate changes, and the outbound TLS path; app-side JWS failures (source=app) are expected noise and are not paged."

      - alert: ZaghlolAppStoreClientErrorRateHigh
        # T-131 (the T-130 L-4 lesson): any other 4xx from Apple is a 502, not a rejection; a rising rate means our requests are wrong.
        expr: |
          sum(rate(zaghlol_store_call_total{store="app_store", outcome="client_error"}[15m]))
          / sum(rate(zaghlol_store_call_total{store="app_store"}[15m])) > 0.2
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "More than 20% of App Store Server API calls end in a 4xx"
          description: "Break it down by the api and env labels. Not-found answers right after a purchase are normal at a low rate; a jump points at a wrong bundle ID, base URL or environment routing."

      - alert: ZaghlolPurchaseVerifyFailureRateHigh
        expr: |
          sum(rate(zaghlol_purchase_verify_total{outcome="failure"}[15m]))
          / sum(rate(zaghlol_purchase_verify_total[15m])) > 0.05
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "More than 5% of purchase verifications fail"
          description: "Break the failure rate down by the code label."

  - name: zaghlol-notifications
    rules:
      - alert: ZaghlolNotificationLagHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(zaghlol_notification_processing_lag_seconds_bucket[5m]))) > 900
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Store notification processing lag is above 15 minutes"
          description: "The notification worker is behind or stuck."

      - alert: ZaghlolNotificationDeadLetter
        expr: sum by (store) (increase(zaghlol_notification_dead_letter_total[10m])) > 0
        labels:
          severity: page
        annotations:
          summary: "A {{ $labels.store }} notification was dead-lettered"
          description: "Inspect the dead-letter queue; the notification was not applied. apple: store_notifications rows with processed_at set and last_error in the failure codes (error-handling section 2); the hourly expiry sweep still repairs subscriptions, a dead-lettered lifetime REFUND needs a human."

      # T-134: App Store Server Notifications V2.
      - alert: ZaghlolAssnBacklogOld
        expr: max(zaghlol_assn_backlog{age="ge_1h"}) > 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "App Store notifications have waited more than an hour"
          description: "The ASSN processor is stuck or deferring (Apple 429, our worker budget, an open circuit). Check the worker log and zaghlol_store_call_total{store=\"app_store\"}."

      - alert: ZaghlolAssnIgnoredProduct
        # Authentic notifications for a product outside Purchases:Apple:Products: our configuration is behind App Store Connect.
        expr: sum by (env) (increase(zaghlol_assn_ingest_total{outcome="ignored_product"}[30m])) > 0
        labels:
          severity: page
        annotations:
          summary: "An App Store notification named a product we don't know ({{ $labels.env }})"
          description: "Gold events for that product are answered 200 and dropped. Add the product to Purchases:Apple:Products or remove it from App Store Connect."

      - alert: ZaghlolAssnEnvMismatch
        expr: sum by (type) (increase(zaghlol_assn_processed_total{outcome="env_mismatch"}[30m])) > 0
        labels:
          severity: warn
        annotations:
          summary: "An App Store notification's environment differs from the stored purchase ({{ $labels.type }})"
          description: "Nothing was written. A production notification for a sandbox row (or the reverse) points at a wrong Sandbox Server URL or AllowSandbox setting."

      - alert: ZaghlolAssnRefundNotReflected
        expr: sum(increase(zaghlol_assn_refund_not_reflected_total[1h])) > 0
        labels:
          severity: warn
        annotations:
          summary: "A REFUND/REVOKE notification was applied while Apple still reported the purchase as paid"
          description: "After four retries Apple's current answer was written (an older period may have been refunded). Look the purchase up by its UUID in purchase_events (cause assn:REFUND) and confirm in App Store Connect."

      - alert: ZaghlolAssnRecovered
        # The daily Get Notification History job inserted rows Apple had failed to deliver.
        expr: sum(increase(zaghlol_assn_recovered_total[1d])) > 0
        labels:
          severity: warn
        annotations:
          summary: "The ASSN history job recovered notifications Apple could not deliver"
          description: "Apple's deliveries to /v1/notifications/apple are failing. Check the App Store Connect server URL, TLS, the notifications-apple rate limit and 5xx answers."

      - alert: ZaghlolAssnHistoryProblem
        expr: sum by (outcome) (increase(zaghlol_assn_reconcile_total{step="history", outcome=~"invalid_entry|truncated|failed"}[1d])) > 0
        labels:
          severity: warn
        annotations:
          summary: "The ASSN history reconciliation reported {{ $labels.outcome }}"
          description: "invalid_entry: an entry from Apple's API failed verification (check the pinned root and Apple news). truncated: more than 20 pages in 7 days. failed: the history call failed; the next daily run retries."

  - name: zaghlol-prices
    rules:
      - alert: ZaghlolPriceAgeWarn
        expr: max by (symbol) (zaghlol_price_age_seconds) > 21600
        labels:
          severity: warn
        annotations:
          summary: "The newest {{ $labels.symbol }} quote is older than 6 hours"
          description: "Check the price provider and the price worker."

      - alert: ZaghlolPriceAgePage
        expr: max by (symbol) (zaghlol_price_age_seconds) > 86400
        labels:
          severity: page
        annotations:
          summary: "The newest {{ $labels.symbol }} quote is older than 24 hours"
          description: "Apps are showing stale prices. Check the price provider and fall back if needed."

  - name: zaghlol-catalog-and-sync
    rules:
      - alert: ZaghlolCatalogSnapshotMissing
        # The synthetic check requests the latest full snapshot URL (synthetics.yaml).
        expr: probe_http_status_code{job="zaghlol-synthetics", check="catalog-latest-snapshot"} == 404
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "The latest full catalog snapshot returns 404"
          description: "Apps cannot download the catalog. Republish the snapshot or fix the CDN origin."

      - alert: ZaghlolSyncResponseSizeHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(zaghlol_sync_response_size_bytes_bucket{up_to_date="true"}[1h]))) > 2048
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: "p95 sync response for up-to-date clients is above 2 KB"
          description: "An up-to-date client should get a tiny response. Check for a payload regression."

  - name: zaghlol-signing
    rules:
      - alert: ZaghlolKmsUnavailable
        # Transient KMS failures after the retry (the API answers 503 with Retry-After).
        expr: sum by (operation) (increase(zaghlol_kms_unavailable_total{operation=~"sign|hmac|data_key|public_key"}[5m])) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "KMS {{ $labels.operation }} calls are failing"
          description: "Responses are not being signed. Check the KMS and the service identity's key permissions."

      - alert: ZaghlolSigningVerifyFailed
        # A signature that fails verification against the published key (T-123 review nit 9): a wrong key reference or ring.
        # Permanent until fixed; retrying does not help.
        expr: sum(increase(zaghlol_kms_unavailable_total{operation="sign_verify"}[5m])) > 0
        labels:
          severity: page
        annotations:
          summary: "A signature failed verification against the published key"
          description: "Configuration fault: the active key reference does not match the published key in the ring. Fix the configuration or roll back."

      - alert: ZaghlolSigningResponseTooLarge
        expr: sum(increase(zaghlol_signing_response_too_large_total[15m])) > 0
        labels:
          severity: warn
        annotations:
          summary: "A signed response exceeded the 1 MiB buffer cap"
          description: "An endpoint is returning a body that cannot be signed in memory."
