# T-175 M-1 (security-model §6 "Dependencies"): automated dependency updates.
# Weekly, grouped, small PR limits. Security updates are raised by GitHub regardless of the schedule.
# Floating Docker tags are bumped as digests (backend/Dockerfile pins @sha256 with the tag in a comment).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      pub-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /tools/drift_codegen
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    groups:
      pub-tools:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /app/android
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /backend/openapi
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    groups:
      npm-all:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    groups:
      actions-all:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    groups:
      docker-all:
        patterns: ["*"]
