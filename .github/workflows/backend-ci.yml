name: backend-ci

on:
  push:
    branches: [main, "task/**"]
    paths:
      - "backend/**"
      - "docs/03-technical/backend-api.md"
      - "docs/03-technical/backend-schema.md"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docs/03-technical/backend-api.md"
      - "docs/03-technical/backend-schema.md"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  IMAGE: zaghlol-backend:ci

jobs:
  build-test:
    name: build, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore Zaghlol.sln || { echo "::error title=dotnet restore::Restore failed (a NuGet audit advisory also fails restore because warnings are errors)."; exit 1; }

      - name: Build (warnings are errors)
        run: |
          dotnet build Zaghlol.sln -c Release --no-restore -warnaserror || { echo "::error title=dotnet build::Build failed; warnings are treated as errors."; exit 1; }

      - name: EF model matches the migrations (no pending model changes)
        run: |
          dotnet tool restore || { echo "::error title=dotnet tool restore::Could not restore dotnet-ef (.config/dotnet-tools.json)."; exit 1; }
          dotnet tool run dotnet-ef migrations has-pending-model-changes \
            --project src/Zaghlol.Infrastructure --startup-project src/Zaghlol.Infrastructure \
            --configuration Release --no-build || { echo "::error title=EF migrations::The EF model and the migration snapshot differ. Generate a migration (backend-ef-migration workflow)."; exit 1; }

      - name: Verify formatting
        run: |
          dotnet format Zaghlol.sln --no-restore --verify-no-changes --verbosity normal || { echo "::error title=dotnet format::Code is not formatted. Run 'dotnet format' in backend/ and commit."; exit 1; }

      - name: Test (unit + Testcontainers PostgreSQL 17 integration)
        run: |
          dotnet test Zaghlol.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory "$GITHUB_WORKSPACE/test-results" || { echo "::error title=dotnet test::One or more tests failed."; exit 1; }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/*.trx
          if-no-files-found: ignore

  openapi-lint:
    name: OpenAPI lint (Spectral)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/openapi
    steps:
      - uses: actions/checkout@v4

      # Node is preinstalled on ubuntu-latest, so no extra action is needed. The CLI is pinned to an exact version.
      - name: Lint zaghlol-v1.yaml (errors and warnings fail the job)
        run: |
          npx --yes @stoplight/spectral-cli@6.15.0 lint zaghlol-v1.yaml --ruleset .spectral.yaml --fail-severity=warn || { echo "::error title=Spectral::OpenAPI lint failed; see the step log."; exit 1; }

  alert-rules:
    name: alert rules (promtool)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # T-138: the rule files are valid Prometheus rules (the rule-file lint test checks names and privacy in build-test).
      - name: promtool check rules
        run: |
          docker run --rm --entrypoint /bin/sh -v "$PWD/backend/deploy/observability/alerts:/rules:ro" prom/prometheus:v3.5.0 \
            -c 'promtool check rules /rules/*.yaml' || { echo "::error title=promtool::Alert rule files are invalid."; exit 1; }

  dependency-audit:
    name: vulnerable packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Zaghlol.sln -p:NuGetAudit=false

      - name: Fail on any vulnerable package (direct or transitive)
        run: |
          dotnet list Zaghlol.sln package --vulnerable --include-transitive --no-restore 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error title=Vulnerable packages::NuGet packages with known vulnerabilities were found; see the job log."
            exit 1
          fi
          if grep -qiE "^\s*error" vulnerable.txt; then
            echo "::error title=Vulnerability check::The vulnerability check itself failed; see the job log."
            exit 1
          fi

  container:
    name: image, non-root, scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t "$IMAGE" backend || { echo "::error title=docker build::Image build failed."; exit 1; }

      - name: Image is configured to run as non-root
        run: |
          user=$(docker image inspect "$IMAGE" --format '{{.Config.User}}')
          echo "Config.User='$user'"
          case "$user" in
            ""|0|0:*|root|root:*)
              echo "::error title=Container user::Image runs as root (Config.User='$user')."
              exit 1
              ;;
          esac

      # T-123: the Production image has no KMS adapter configured, so it must refuse to start (fail closed).
      - name: Production image refuses to start without a KMS
        run: |
          set +e
          timeout 60 docker run --rm \
            -e 'ConnectionStrings__App=Host=127.0.0.1;Port=1;Database=none;Username=none' \
            -e 'ConnectionStrings__Admin=Host=127.0.0.1;Port=1;Database=none;Username=none' \
            "$IMAGE" > prod.log 2>&1
          code=$?
          set -e
          tail -n 20 prod.log
          if [ "$code" = "0" ] || [ "$code" = "124" ]; then
            echo "::error title=KMS fail-closed::The Production image did not refuse to start without a KMS (exit $code)."
            exit 1
          fi
          grep -q 'KmsConfigurationException' prod.log || { echo "::error title=KMS fail-closed::The Production image exited for another reason (exit $code)."; exit 1; }

      # No database here, so readiness must fail closed: 503 UPSTREAM_UNAVAILABLE (FU-003). The 200 path with a real
      # database is covered by compose-smoke and the Testcontainers tests. The Local KMS (Development only) signs
      # with throwaway keys made by tools/dev-keys.sh.
      - name: Container process runs as non-root and serves /v1/health (503 without a database)
        run: |
          sh backend/tools/dev-keys.sh
          cid=$(docker run -d -p 8080:8080 \
            -e 'ASPNETCORE_ENVIRONMENT=Development' \
            --env-file backend/.dev-keys/kms.env \
            -v "$PWD/backend/.dev-keys:/run/zaghlol-dev-keys:ro" \
            -e 'ConnectionStrings__App=Host=127.0.0.1;Port=1;Database=none;Username=none' \
            -e 'ConnectionStrings__Admin=Host=127.0.0.1;Port=1;Database=none;Username=none' \
            "$IMAGE")
          status=""
          for i in $(seq 1 30); do
            status=$(curl -sS -o health.json -w '%{http_code}' http://localhost:8080/v1/health || true)
            if [ "$status" = "503" ]; then break; fi
            sleep 1
          done
          if [ "$status" != "503" ]; then
            docker logs "$cid"
            echo "::error title=Container health::/v1/health did not return 503 without a database (got '$status')."
            exit 1
          fi
          cat health.json; echo
          grep -q '"code":"UPSTREAM_UNAVAILABLE"' health.json || { echo "::error title=Container health::Unexpected /v1/health body."; exit 1; }
          docker top "$cid" -eo pid,uid,args
          uid=$(docker top "$cid" -eo pid,uid,args | grep 'Zaghlol.Api.dll' | awk '{print $2}' | head -n1)
          echo "Process uid=$uid"
          if [ -z "$uid" ] || [ "$uid" = "0" ] || [ "$uid" = "root" ]; then
            docker rm -f "$cid" >/dev/null
            echo "::error title=Container user::API process is running as root or its uid could not be determined (uid='$uid')."
            exit 1
          fi
          docker rm -f "$cid" >/dev/null

      - name: Scan image (Trivy, fixable HIGH/CRITICAL)
        id: trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            ghcr.io/aquasecurity/trivy:0.58.1 image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress \
              "$IMAGE"

      - name: Report scan failure
        if: failure() && steps.trivy.outcome == 'failure'
        run: echo "::error title=Container scan::Trivy found fixable HIGH/CRITICAL vulnerabilities in the image; see the scan step log."

  compose-smoke:
    name: docker compose up serves /v1/health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PORT: "55432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Compose up (waits for healthchecks of postgres, api, worker)
        run: |
          sh tools/dev-keys.sh
          docker compose up -d --build --wait --wait-timeout 240 || {
            docker compose ps
            docker compose logs --no-color
            echo "::error title=docker compose::Stack did not become healthy."
            exit 1
          }

      - name: Health endpoint returns 200
        run: |
          curl -fsS http://localhost:8080/v1/health | tee health.json
          echo
          grep -q '"status":"ok"' health.json || { echo "::error title=docker compose::/v1/health did not return status ok."; exit 1; }

      # T-138: metrics reach the local collector. The api exports OTLP every 5 s; the collector serves Prometheus text on :8889.
      - name: Metrics are visible in the local collector
        run: |
          for i in 1 2 3 4 5; do curl -fsS http://localhost:8080/v1/health >/dev/null; done
          found=""
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8889/metrics > metrics.txt || true
            if grep -q '^zaghlol_service_up' metrics.txt && grep -q '^http_server_request_duration_seconds_count' metrics.txt; then found=yes; break; fi
            sleep 2
          done
          grep -E '^(zaghlol_|http_server_request_duration_seconds_count)' metrics.txt | head -n 20 || true
          if [ -z "$found" ]; then
            docker compose logs --no-color otel-collector api | tail -n 80
            echo "::error title=Metrics::zaghlol_* series did not reach the collector."
            exit 1
          fi

      - name: Dump logs
        if: always()
        run: docker compose logs --no-color

      - name: Compose down
        if: always()
        run: docker compose down -v
