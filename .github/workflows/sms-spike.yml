name: sms-spike

# T-008 (SPK-01, ADR-005): Android emulator runs of the SMS ingestion spike
# (devSms only): killed app → SMS → receiver → encrypted spool → expedited
# WorkManager → headless engine → parse → DB commit → ack. Records the
# latency table per API level (emulator, profile build: indicative, the
# device numbers come from the manual runs in T-008.md) and runs the negative
# proofs (spoofed broadcast denied, non-allowlisted / OTP spool nothing,
# canary absent from the app's logs). Not a merge gate.
on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/**'
    paths:
      - 'app/android/app/src/devSms/**'
      - 'app/lib/ingestion/**'
      - 'app/tool/spike/**'
      - .github/workflows/sms-spike.yml
      - .github/scripts/sms-spike-device.sh

permissions:
  contents: read

concurrency:
  group: sms-spike-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with app-ci.yml.
  FLUTTER_VERSION: '3.47.9'

jobs:
  emulator:
    name: emulator API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api: [26, 30, 34, 36]
    env:
      API: ${{ matrix.api }}
      DEVICE: emulator-5554
      N: '6'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace (lockfile must be up to date)
        run: flutter pub get --enforce-lockfile
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/sms-spike-device.sh
      - name: Results to summary
        if: always()
        run: |
          f="$RUNNER_TEMP/sms-spike/report.md"
          if [ -f "$f" ]; then
            { echo "### SMS spike, emulator API $API (profile build)"; cat "$f"; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: sms-spike-api${{ matrix.api }}
          path: |
            ${{ runner.temp }}/sms-spike/metrics.csv
            ${{ runner.temp }}/sms-spike/report.md
            ${{ runner.temp }}/sms-spike/spoof.txt
            ${{ runner.temp }}/sms-spike/canary-lines.txt
            ${{ runner.temp }}/sms-spike/build.log
          if-no-files-found: warn
          retention-days: 30
