name: backend-server-kit

# Checks of the self-hosted server kit (ADR-025, backend/deploy/server/): `docker compose config` on the production stack with
# the example env files (plus the OpenBao and observability overrides), Caddyfile / Prometheus / Alertmanager validation,
# shellcheck on every script, actionlint on the deploy workflows. Nothing is deployed and no secret is used.
on:
  push:
    branches: ["batch/**", "ci/**"]
    paths:
      - "backend/deploy/server/**"
      - "backend/deploy/openbao/**"
      - "backend/deploy/observability/**"
      - ".github/workflows/backend-deploy-server.yml"
      - ".github/workflows/backend-deploy.yml"
      - ".github/workflows/backend-server-kit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-server-kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-config:
    name: docker compose config (prod stack, overrides)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/deploy/server
    env:
      ZAGHLOL_APP_ENV_FILE: app.env.example
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Base stack
        run: docker compose --env-file production.env.example -f docker-compose.prod.yml config -q

      - name: With the OpenBao override
        run: docker compose --env-file production.env.example -f docker-compose.prod.yml -f ../openbao/docker-compose.openbao.yml config -q

      - name: With the observability override and the otel profile
        run: docker compose --env-file production.env.example --profile otel -f docker-compose.prod.yml -f observability/docker-compose.observability.yml config -q

      - name: A missing required variable is refused (no silent default for secrets)
        run: |
          grep -v '^DB_API_PASSWORD=' production.env.example > /tmp/incomplete.env
          if docker compose --env-file /tmp/incomplete.env -f docker-compose.prod.yml config -q 2>/tmp/err; then
            echo "::error title=compose::config succeeded without DB_API_PASSWORD"; exit 1
          fi
          grep -q DB_API_PASSWORD /tmp/err

      - name: Hardening assertions on the resolved stack
        run: |
          docker compose --env-file production.env.example -f docker-compose.prod.yml -f ../openbao/docker-compose.openbao.yml config --format json > /tmp/stack.json
          fail=0
          check() {
            if jq -e "$2" /tmp/stack.json > /dev/null; then echo "ok:   $1"; else echo "::error title=hardening::FAILED: $1"; fail=1; fi
          }
          check "only caddy publishes ports" '[.services | to_entries[] | select((.value.ports // []) | length > 0) | .key] == ["caddy"]'
          check "caddy publishes only 80 and 443" '[.services.caddy.ports[].target] | sort == [80,443,443]'
          check "every service has no-new-privileges" '[.services | to_entries[] | select(((.value.security_opt // []) | index("no-new-privileges:true")) == null) | .key] == []'
          # compose prints a zero ulimit as {} in its JSON output
          check "every service has core ulimit 0" '[.services | to_entries[] | select(((.value.ulimits.core // null) != {}) and ((.value.ulimits.core // null) != 0)) | .key] == []'
          check "api and worker run as 1654" '.services.api.user == "1654:1654" and .services.worker.user == "1654:1654"'
          check "api and worker have read-only roots" '.services.api.read_only == true and .services.worker.read_only == true'
          check "api key directory is read-only" '[.services.api.volumes[] | select(.target == "/run/zaghlol-kms") | .read_only] == [true]'
          check "worker key directory is read-only" '[.services.worker.volumes[] | select(.target == "/run/zaghlol-kms") | .read_only] == [true]'
          check "every image is pinned by digest" '[.services | to_entries[] | select((.value.image | test("@sha256:[0-9a-f]{64}$")) | not) | .key] == []'
          check "api has no migrator credential" '(.services.api.environment | tostring | contains("migrator")) | not'
          if [ "$fail" -ne 0 ]; then jq '.services | map_values({ports, user, read_only, security_opt, ulimits, image})' /tmp/stack.json; exit 1; fi

      - name: Example env files hold no real-looking secret
        run: |
          if grep -nE 'AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----[^\\]|ghp_[A-Za-z0-9]{20,}|[0-9a-f]{64}$' app.env.example production.env.example | grep -vE '@sha256:|0{64}'; then
            echo "::error title=secrets::an example env file contains something that looks like a real secret"; exit 1
          fi

  proxy-and-monitoring:
    name: Caddyfile, Prometheus, Alertmanager
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: caddy validate
        run: |
          docker run --rm -e API_DOMAIN=api.example.com -e ACME_EMAIL=ops@example.com -e ADMIN_ALLOWED_CIDRS="203.0.113.10/32 198.51.100.0/24" \
            -v "$PWD/backend/deploy/server/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: the access log filter drops response headers (Apple callback Location, FU-275 1-1)
        run: |
          docker run --rm -e API_DOMAIN=api.example.com -e ACME_EMAIL=ops@example.com -e ADMIN_ALLOWED_CIDRS="203.0.113.10/32" \
            -v "$PWD/backend/deploy/server/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10 \
            caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile > /tmp/caddy.json
          jq -e '[.. | objects | select(has("fields")) | .fields.resp_headers.filter] | any(. == "delete")' /tmp/caddy.json
          jq -e '[.. | objects | select(has("fields")) | .fields["request>headers"].filter] | any(. == "delete")' /tmp/caddy.json

      - name: caddy fmt is clean
        run: |
          docker run --rm -v "$PWD/backend/deploy/server/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10 \
            sh -c 'caddy fmt /etc/caddy/Caddyfile | diff -u /etc/caddy/Caddyfile -' || echo "::warning title=caddy fmt::Caddyfile is not in caddy fmt style (not blocking)"

      - name: promtool check config (rules included)
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/backend/deploy/server/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/backend/deploy/observability/alerts:/etc/prometheus/alerts:ro" \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml

      - name: amtool check-config (example)
        run: |
          mkdir am
          cp backend/deploy/server/observability/alertmanager.yml.example am/alertmanager.yml
          echo placeholder > am/smtp-password
          docker run --rm --entrypoint amtool -v "$PWD/am:/etc/alertmanager:ro" prom/alertmanager:v0.28.1 \
            check-config /etc/alertmanager/alertmanager.yml

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: shellcheck
        run: |
          shellcheck --version
          find backend/deploy/server -name '*.sh' -print0 | xargs -0 shellcheck -x -S style
      - name: scripts are executable
        run: |
          find backend/deploy/server -name '*.sh' ! -perm -u+x -print | tee /tmp/notexec
          test ! -s /tmp/notexec

  restore-test:
    name: restore.sh never empties the source database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: bash backend/deploy/server/tests/restore-test.sh

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: actionlint on the deploy workflows
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color \
            .github/workflows/backend-deploy-server.yml .github/workflows/backend-server-kit.yml
