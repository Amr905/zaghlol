            if git push -q "$url" HEAD:refs/heads/device-shots; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "could not publish the screenshots"

  e2e-settings:
    name: android emulator API 34 (T-238 E2E, export language lock wipe)
    # T-238: E2E-09..12 (export as Free/Gold, language and digits, app lock, delete everything), its own job.
    if: ${{ !inputs.explorer_only && !inputs.t165_only && !inputs.notif_only && !inputs.sms_only && !inputs.scenario_only && (!startsWith(github.ref_name, 'ci/T-23') || startsWith(github.ref_name, 'ci/T-238')) && !startsWith(github.ref_name, 'ci/TEST-explorer3') && github.ref_name != 'ci/SMS-device' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEVICE: emulator-5554
      JOB_LABEL: e2e-settings
      API: ${{ inputs.api || '34' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
