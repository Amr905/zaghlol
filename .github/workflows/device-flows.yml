          if-no-files-found: warn
          retention-days: 14
      # The Lead's workspace cannot download artifacts (blob storage is blocked),
      # so the screenshots are also committed to the `device-shots` branch, under
      # <sha>/<job label>/ (T-231: several jobs publish for one commit, so each
      # adds its own folder to the branch instead of replacing it).
      - name: Publish screenshots to the device-shots branch
        if: always()
        env:
          SHOTS: ${{ runner.temp }}/device-flows
        run: |
          set -eu
          ls "$SHOTS"/screens/*.png "$SHOTS"/screens/*/*.png >/dev/null 2>&1 || ls "$SHOTS"/*.log >/dev/null 2>&1 || { echo "no screenshots or logs"; exit 0; }
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          dir=$(mktemp -d)
          cd "$dir"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            rm -rf ./* 2>/dev/null || true
            if git fetch -q --depth 1 "$url" device-shots 2>/dev/null; then
              git checkout -q -B shots FETCH_HEAD
            else
              git checkout -q -B shots
            fi
            out="$GITHUB_SHA/$JOB_LABEL"
            mkdir -p "$out"
            cp -r "$SHOTS"/screens/. "$out"/ 2>/dev/null || true
            cp "$SHOTS"/*.log "$out"/ 2>/dev/null || true
            git add -A
            git commit -qm "device-flows $JOB_LABEL for $GITHUB_SHA ($GITHUB_REF_NAME)" || true
            if git push -q "$url" HEAD:refs/heads/device-shots; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "could not publish the screenshots"

  explorer:
    name: explorer ${{ matrix.plan }}
    # Not for the single-purpose runs (SMS, T-165, T-193).
    if: ${{ !inputs.sms_only && !inputs.t165_only && !inputs.notif_only && !inputs.scenario_only && !startsWith(github.ref_name, 'ci/T-233') && github.ref_name != 'ci/SMS-device' && !startsWith(github.ref_name, 'ci/B53-t193') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        plan: ${{ fromJSON(inputs.explorer_plan && inputs.explorer_plan != 'all' && format('["{0}"]', inputs.explorer_plan) || (startsWith(github.ref_name, 'ci/TEST-explorer3') && '["new"]' || '["base-a","base-b","variants-a","variants-b","variants-c","new"]')) }}
    env:
      DEVICE: emulator-5554
      JOB_LABEL: explorer-${{ matrix.plan }}
      API: ${{ inputs.api || '34' }}
      EXPLORER_ONLY: '1'
      EXPLORER_PLAN: ${{ matrix.plan }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
