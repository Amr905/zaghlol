name: t165-backup-emu

# T-165 (FR-SEC-05) on Android emulators API 30 and 34: Auto Backup through the
# local transport, adb backup and the D2D transport must not carry app data.
# Not a merge gate; push to ci/** or run by hand. Synthetic canaries only.
on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/DEVICE-emu'
    paths:
      - '.github/workflows/t165-backup-emu.yml'
      - '.github/scripts/t165-backup-emu.sh'

permissions:
  contents: read

concurrency:
  group: t165-backup-emu-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  emulator:
    name: emulator API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    env:
      API: ${{ matrix.api }}
      DEVICE: emulator-5554
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace (lockfile must be up to date)
        run: flutter pub get --enforce-lockfile
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/t165-backup-emu.sh
