name: app-bootstrap

# One-shot helper for T-001: generates the Flutter platform folders (app/android,
# app/ios) with `flutter create` when they do not exist yet and commits them back
# to the branch. It is a no-op once the folders exist.
on:
  workflow_dispatch:
  push:
    branches:
      - 'task/T-001*'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Check whether platform folders exist
        id: check
        run: |
          if [ -d app/android ] && [ -d app/ios ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.needed == 'true'
        with:
          channel: stable

      - name: flutter create
        if: steps.check.outputs.needed == 'true'
        run: |
          flutter --version
          flutter create --org app.zaghlol --project-name zaghlol --platforms android,ios --no-pub app

      - name: Commit generated files
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app
          if git diff --cached --quiet; then
            echo "Nothing changed; skipping commit."
          else
            git commit -m "chore(app): flutter create scaffold (generated by app-bootstrap)"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
