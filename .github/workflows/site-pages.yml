name: site-pages

# FU-195 (batch 54): publishes the static site in site/ (landing, privacy,
# terms, support, subscription, get) to GitHub Pages. Manual only: nothing goes
# public until the PO runs it (Actions > site-pages > Run workflow).
# One-time setup: Settings > Pages > Source = "GitHub Actions"; custom domain
# zaghlol.app (see site/README.md).
on:
  workflow_dispatch:
    inputs:
      allow_placeholders:
        description: 'Publish even if {{PLACEHOLDER}} values are still in the pages (draft preview only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: site-pages
  cancel-in-progress: false

jobs:
  check:
    name: site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: No scripts, external resources or trackers
        run: |
          set -euo pipefail
          fail=0
          if grep -rniE '<script|<iframe|<object|<embed' site --include='*.html'; then
            echo "::error::site/ must not contain scripts or embeds"; fail=1
          fi
          # Stylesheets, images and fonts must be local (relative URLs).
          if grep -rniE '(src|href)="(https?:)?//[^"]*"[^>]*' site --include='*.html' | grep -iE '<(link|img|source|video|audio)'; then
            echo "::error::site/ must load no external resources"; fail=1
          fi
          if grep -rniE '@import|url\((["'"'"'])?(https?:)?//' site --include='*.css'; then
            echo "::error::site CSS must not load external resources"; fail=1
          fi
          exit $fail
      - name: Placeholders filled
        if: ${{ !inputs.allow_placeholders }}
        run: |
          if grep -rnoE '\{\{[A-Z_]+\}\}' site --include='*.html' | sort -u; then
            echo "::error::fill every {{PLACEHOLDER}} above (or run with allow_placeholders for a draft preview)"
            exit 1
          fi

  deploy:
    name: deploy to GitHub Pages
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Verify these pins against the releases before the first run.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Stage site (without the README)
        run: mkdir _site && cp -R site/. _site/ && rm -f _site/README.md
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
