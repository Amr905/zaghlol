name: app-ci

# App CI (T-003): the checks the Definition of Done requires on every PR.
# Supersedes app-smoke.yml; every smoke check (9 flavor builds, aapt2 SMS
# assertions) is kept below.
# Batch CI (PO, 2026-11-10): task branches are verified on the PO's PC runner (docs/workflow/local-ci.md).
# GitHub runs once per batch of ~5 tasks (batch/**) or when an agent opts in by pushing to ci/<task>.
on:
  push:
    branches:
      - 'batch/**'
      - 'ci/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Exact Flutter version: keeps builds reproducible together with pubspec.lock.
  # Keep in sync with FLUTTER_VERSION / FLUTTER_SHA in app-regen.yml.
  FLUTTER_VERSION: '3.47.9'

jobs:
  static:
    name: format, analyze, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace (lockfile must be up to date)
        run: flutter pub get --enforce-lockfile
      - name: Pigeon generated files are up to date (T-004)
        run: |
          bash app/tool/generate_pigeon.sh > pigeon.log 2>&1 || { cat pigeon.log; exit 1; }
          stale=$(git status --porcelain -- app/lib/core/platform app/android/app/src/main/kotlin/app/zaghlol/platform app/ios/Runner/Platform)
          if [ -n "$stale" ]; then
            echo "$stale" | while read -r line; do echo "::error::pigeon output is stale or untracked: $line"; done
            echo "::error::run app/tool/generate_pigeon.sh and commit the generated files"
            git diff --stat -- app | tail -n 20
            exit 1
          fi
      # T-016: drift code and schema dumps come from the standalone
      # tools/drift_codegen (drift_dev can't resolve in the workspace). A
      # table change without a schemaVersion bump makes make-migrations fail
      # (the committed v<N> dump differs); a stale .g.dart or dump shows as a
      # diff.
      - name: drift generated files and schema dump are up to date (T-016)
        run: |
          bash app/tool/generate_drift.sh > drift.log 2>&1 || { cat drift.log; echo "::error::app/tool/generate_drift.sh failed (schema changed without a version bump?)"; exit 1; }
          stale=$(git status --porcelain -- app/lib/core/db/schema app/drift_schemas app/test/core/db/migrations tools/drift_codegen)
          if [ -n "$stale" ]; then
            echo "$stale" | while read -r line; do echo "::error::drift output is stale or untracked: $line"; done
            echo "::error::run app/tool/generate_drift.sh and commit the generated files"
            git diff --stat -- app tools | tail -n 20
            exit 1
          fi
      - name: Flutter version must match app-regen.yml
        run: |
          ci=$(grep -E "^  FLUTTER_VERSION:" .github/workflows/app-ci.yml | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          regen=$(grep -E "^  FLUTTER_VERSION:" .github/workflows/app-regen.yml | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          if [ -z "$ci" ] || [ "$ci" != "$regen" ]; then
            echo "::error::FLUTTER_VERSION differs: app-ci.yml='$ci' app-regen.yml='$regen'"
            exit 1
          fi
      - name: T-165 backup assertion self-test (negative controls)
        run: bash .github/scripts/test-check-no-os-backup.sh
      # R2-N1 (T-003 review, landed in T-007): the app-regen commit job's
      # pubspec.lock validator, run against the current lock and bad fixtures.
      - name: pubspec.lock validator self-test (app-regen)
        run: bash .github/scripts/test-lock-validator.sh
      - name: dart format
        run: |
          if ! dart format --output=none --set-exit-if-changed . > format.log 2>&1; then
            while read -r line; do echo "::error::format: $line"; done < format.log
            exit 1
          fi
      - name: flutter analyze
        run: |
          if ! flutter analyze > analyze.log 2>&1; then
            grep -iE "^\s*(info|warning|error)" analyze.log | while read -r line; do echo "::error::analyze: $line"; done
            tail -n 5 analyze.log | while read -r line; do echo "::error::analyze: $line"; done
            exit 1
          fi
      - name: "zaghlol_lints (T-002 - money, UI strings, print, SafeException)"
        working-directory: tools/lints
        run: |
          if ! dart run bin/zaghlol_lints.dart ../../app ../../packages/zaghlol_parsing ../../packages/zaghlol_domain ../../packages/zaghlol_catalog ../../tools/catalog_build > lints.log 2>&1; then
            cat lints.log
            grep -E "^\S+:[0-9]+:" lints.log | head -n 20 | while read -r line; do echo "::error::zaghlol_lints: $line"; done
            exit 1
          fi
          cat lints.log
      - name: dart test (zaghlol_lints)
        working-directory: tools/lints
        run: dart test
      # T-015 / FU-050: no logging in the key code (Dart, Kotlin, Swift).
      # Generated Pigeon files are excluded (their generic error path is never
      # used: every error is a code-only SecretStoreApiError).
      # T-016 (S-5): also stdout/stderr/dump, and core/db/schema.
      # T-017: also the DAOs, the frozen migration steps and the .drift DDL.
      - name: no logging in key, database, backup crypto/snapshot and capture code (T-015, T-016, T-017, T-148, T-149, T-039, T-040, T-041)
        run: |
          set -o pipefail
          files=$(ls app/lib/core/db/*.dart app/lib/core/db/schema/*.dart app/lib/core/db/schema/*.drift \
            app/lib/core/db/daos/*.dart app/lib/core/db/migrations/*.dart app/lib/core/crypto/*.dart \
            app/lib/core/platform/pigeon_secret_store.dart app/lib/core/platform/pigeon_text_normalizer.dart \
            app/lib/features/backup/crypto/*.dart \
            app/lib/features/backup/application/*.dart app/lib/features/backup/data/*.dart \
            app/android/app/src/main/kotlin/app/zaghlol/platform/text/*.kt app/ios/Runner/Platform/Text/*.swift \
            app/android/app/src/main/kotlin/app/zaghlol/platform/keys/*.kt \
            app/ios/Runner/Platform/Keys/*.swift | grep -v '\.g\.')
          # T-008: the SMS spike (Kotlin, except its code-only SpikeLog) and the
          # Dart ingestion engines must not log either.
          files="$files $(ls app/android/app/src/devSms/kotlin/app/zaghlol/spike/sms/*.kt app/lib/ingestion/*.dart | grep -v 'SpikeLog\.kt')"
          # T-039 (design note section 9): the production spool, capture host and
          # Capture Guard (T-038; the directory may not exist yet) never log.
          # Generated Pigeon files are excluded.
          ls app/android/app/src/main/kotlin/app/zaghlol/platform/spool/*.kt app/android/app/src/main/kotlin/app/zaghlol/platform/capture/AndroidCaptureHost.kt > /dev/null \
            || { echo "::error::spool / capture host sources not found"; exit 1; }
          files="$files $(find app/android/app/src/main/kotlin/app/zaghlol/platform/spool app/android/app/src/main/kotlin/app/zaghlol/platform/capture app/android/app/src/main/kotlin/app/zaghlol/platform/guard -name '*.kt' ! -name '*.g.kt' 2>/dev/null || true)"
          # T-040 (design note section 9): the SMS receiver glue (src/sms) never logs.
          ls app/android/app/src/sms/kotlin/app/zaghlol/platform/capture/SmsReceiver.kt > /dev/null \
            || { echo "::error::SmsReceiver source not found"; exit 1; }
          files="$files $(find app/android/app/src/sms/kotlin -name '*.kt')"
          # T-041 (design note section 10): the ingestion worker, drain loop and
          # headless engine never log.
          ls app/android/app/src/main/kotlin/app/zaghlol/platform/ingest/IngestionWorker.kt > /dev/null \
            || { echo "::error::ingest sources not found"; exit 1; }
          files="$files $(find app/android/app/src/main/kotlin/app/zaghlol/platform/ingest -name '*.kt' ! -name '*.g.kt')"
          # T-046: the IngestRawMessages use case (domain, application, data).
          files="$files $(ls app/lib/features/ingestion/*/*.dart)"
          # T-047: the capture module (Guard config writer, orchestrator).
          files="$files $(ls app/lib/features/capture/*/*.dart)"
          # T-151: the iCloud backup host never logs.
          files="$files $(ls app/ios/Runner/Platform/ICloud/*.swift)"
          [ -n "$files" ] || { echo "::error::no key files found"; exit 1; }
          if grep -nE '\b(print|debugPrint|log|developer\.log|dump)\(|\b(stdout|stderr)\b|\bLog\.[a-z]+\(|println\(|Timber|NSLog|os_log|Logger\(|logStatements: *true' $files; then
            echo "::error::logging call in key code"
            exit 1
          fi
      # T-007: test-only code (integration_test, the DB contract/benchmark
      # under app/test/core/db) must never be reachable from lib/.
      - name: lib/ does not import test-only code (T-007)
        run: |
          if grep -RnE "integration_test|flutter_test|/test/|test_driver" app/lib; then
            echo "::error::app/lib references integration_test or test-only code"
            exit 1
          fi
      # The DB contract (app/test/core/db, untagged) runs here on every push;
      # the 50k-row benchmark (tag benchmark) runs in db-platform.yml.
      - name: flutter test (app, non-golden, non-benchmark)
        working-directory: app
        run: flutter test --exclude-tags golden,benchmark
      - name: dart test (zaghlol_domain)
        working-directory: packages/zaghlol_domain
        run: dart test
      - name: dart test (zaghlol_parsing)
        working-directory: packages/zaghlol_parsing
        run: dart test
      # T-032: the registry lint CLI and its self-tests. Once the real
      # registry exists (T-036), add `dart run registry_lint` over it here.
      - name: dart test (registry_lint)
        working-directory: tools/registry_lint
        run: dart test
      # T-030: seed codec and ES256 signature (incl. the backend vectors),
      # then the catalog builder, whose test also fails when the committed
      # app/assets/catalog files or tools/catalog_build/data/catalog_seed.csv
      # are out of date (run the CLI, see its header).
      - name: dart test (zaghlol_catalog)
        working-directory: packages/zaghlol_catalog
        run: dart test
      - name: dart test (catalog_build)
        working-directory: tools/catalog_build
        run: dart test

  golden:
    name: widget golden tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get --enforce-lockfile
      - name: flutter test (golden)
        working-directory: app
        run: flutter test --tags golden
      # flutter_test writes <golden dir>/failures/*_{masterImage,testImage,isolatedDiff,maskedDiff}.png
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: golden-diffs
          path: app/test/**/failures/**
          if-no-files-found: warn
          retention-days: 14

  kotlin-unit:
    name: kotlin unit tests (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get --enforce-lockfile
      # The Flutter tool generates the Gradle wrapper and local.properties, so
      # one debug build is needed before invoking Gradle directly.
      - name: Prepare Android project
        working-directory: app
        # One retry: the runner's SDK/NDK download occasionally returns a corrupt zip.
        run: |
          for attempt in 1 2; do
            if flutter build apk --debug --flavor devNoSms > prepare.log 2>&1; then exit 0; fi
            echo "attempt $attempt failed"; tail -n 20 prepare.log
          done
          echo "::error::could not prepare the Android project"
          exit 1
      - name: Gradle unit tests
        working-directory: app/android
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDevNoSmsDebugUnitTest testDevSmsDebugUnitTest 2>&1 | tee ../gradle-test.log
      # Guard against a green run with zero tests (for example an emptied test dir).
      # Flutter redirects Gradle's buildDir to app/build/app/.
      - name: Assert Kotlin tests actually ran
        run: |
          if ! grep -E "^> Task :app:testDevNoSmsDebugUnitTest$" app/gradle-test.log; then
            echo "::error::testDevNoSmsDebugUnitTest did not execute (NO-SOURCE, UP-TO-DATE or missing)"
            grep -E "testDevNoSmsDebugUnitTest" app/gradle-test.log || true
            exit 1
          fi
          n=$(cat app/build/app/test-results/testDevNoSmsDebugUnitTest/*.xml 2>/dev/null | grep -c "<testcase " || true)
          echo "kotlin testcases: $n"
          if [ "$n" -lt 1 ]; then
            echo "::error::no Kotlin <testcase> found in Gradle results"
            exit 1
          fi
          # T-039: the spool and capture host JVM tests (moved from the spike) run in every variant.
          # T-040: plus the receiver intake, adapters, reserve and coalescing tests (~225 at T-040).
          n=$(cat app/build/app/test-results/testDevNoSmsDebugUnitTest/*.xml 2>/dev/null | grep -cE '<testcase [^>]*classname="app\.zaghlol\.platform\.(spool|capture)\.' || true)
          echo "spool + capture kotlin testcases: $n"
          if [ "$n" -lt 200 ]; then
            echo "::error::expected the T-039/T-040 spool and capture tests in testDevNoSmsDebugUnitTest, found $n"
            exit 1
          fi
          # T-041: the worker, drain loop and headless engine JVM tests (moved
          # from the spike to src/test) run in every variant.
          n=$(cat app/build/app/test-results/testDevNoSmsDebugUnitTest/*.xml 2>/dev/null | grep -cE '<testcase [^>]*classname="app\.zaghlol\.platform\.ingest\.' || true)
          echo "ingest kotlin testcases: $n"
          if [ "$n" -lt 45 ]; then
            echo "::error::expected the T-041 ingest tests in testDevNoSmsDebugUnitTest, found $n"
            exit 1
          fi
          # T-008: the SMS spike's JVM tests live in src/testDevSms.
          if ! grep -E "^> Task :app:testDevSmsDebugUnitTest$" app/gradle-test.log; then
            echo "::error::testDevSmsDebugUnitTest did not execute"
            exit 1
          fi
          # T-039 moved the spool tests and T-041 the worker tests to src/test;
          # T-040 replaced the spike receiver, intake and Guard: count the
          # spike's own tests (latency recorder, sources, canary) only.
          n=$(cat app/build/app/test-results/testDevSmsDebugUnitTest/*.xml 2>/dev/null | grep -cE '<testcase [^>]*classname="app\.zaghlol\.spike\.' || true)
          echo "devSms spike kotlin testcases: $n"
          if [ "$n" -lt 8 ]; then
            echo "::error::expected the T-008 spike tests in testDevSmsDebugUnitTest, found $n"
            exit 1
          fi
      # T-165: AllowBackup / DataExtractionRules / FullBackupContent are fatal
      # in app/android/app/lint.xml; abortOnError fails the task on any of them.
      - name: Android lint (backup rules fatal)
        working-directory: app/android
        run: |
          set -o pipefail
          # T-165 F6: one Sms variant is linted too (devSms also holds the T-008 spike).
          if ! ./gradlew --no-daemon :app:lintDevNoSmsDebug :app:lintDevSmsDebug 2>&1 | tee ../gradle-lint.log; then
            for report in $(find ../build/app -name 'lint-results-dev*SmsDebug.txt'); do cat "$report"; done
            exit 1
          fi
      - name: Assert lint ran with the T-165 config
        run: |
          if ! grep -E "^> Task :app:lintDevNoSmsDebug$" app/gradle-lint.log; then
            echo "::error::lintDevNoSmsDebug did not execute"
            grep -E "lintDevNoSmsDebug" app/gradle-lint.log || true
            exit 1
          fi
          for id in AllowBackup DataExtractionRules FullBackupContent; do
            if ! grep -qE "<issue id=\"$id\" severity=\"(fatal|error)\"" app/android/app/lint.xml; then
              echo "::error::lint.xml does not raise $id to error/fatal"
              exit 1
            fi
          done
      - name: Upload Gradle test reports
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kotlin-test-reports
          path: |
            app/build/app/reports/tests/**
            app/build/app/reports/lint-results*
          if-no-files-found: warn
          retention-days: 14

  swift-unit:
    name: swift unit tests (xcodebuild)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Pin Xcode (reproducible simulator and toolchain)
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get --enforce-lockfile
      - name: Generate iOS config
        working-directory: app
        run: flutter build ios --config-only --no-codesign --flavor dev > config.log 2>&1 || { tail -n 40 config.log; exit 1; }
      - name: xcodebuild test
        working-directory: app/ios
        run: |
          UDID=$(xcrun simctl list devices available iPhone | grep -Eo '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}' | head -n 1)
          if [ -z "$UDID" ]; then
            echo "::error::no iPhone simulator available"
            xcrun simctl list devices available
            exit 1
          fi
          if ! xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme dev \
            -configuration Debug-dev \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO > xcodebuild.log 2>&1; then
            grep -E "error:|Test Case.*failed|\*\* TEST FAILED" xcodebuild.log | head -n 30 | while read -r line; do echo "::error::xcodebuild: $line"; done
            tail -n 30 xcodebuild.log
            exit 1
          fi
          grep -iE "test case|test suite|executed" xcodebuild.log | tail -n 10
          # A green build must also prove the test bundle actually ran.
          if ! grep -qiE "test case.*RunnerTests.*passed" xcodebuild.log; then
            echo "::error::no passing RunnerTests test case found in xcodebuild output"
            tail -n 40 xcodebuild.log
            exit 1
          fi
          # T-165 (FR-SEC-05): each isExcludedFromBackup test must have run and passed.
          for t in testAppContainerDirectoriesAreExcludedAtLaunch testDirectorySetCoversTheFlutterDataRoots \
            testFreshDirectoryIsNotExcludedByDefault testEnsureExcludedCreatesAndExcludes \
            testEnsureExcludedIsIdempotent testEnsureExcludedSurvivesDeleteAndRecreate \
            testExcludeMarksEveryDirectory testExcludeReportsFailureWithoutStoppingOrCrashing \
            testFilesCreatedLaterStayUnderAnExcludedDirectory \
            testAppGroupDirectoriesAreSkippedWithoutAContainer; do
            # xcodebuild can interleave lines, cutting a "passed" line; xcodebuild already exited 0, so require
            # that the test ran (its name appears) and that no line reports it failed.
            if ! grep -qiE "BackupExclusionTests.*$t" xcodebuild.log || grep -qiE "test case.*BackupExclusionTests.*$t.*failed" xcodebuild.log; then
              echo "::error::BackupExclusionTests.$t did not pass"
              grep -iE "BackupExclusionTests" xcodebuild.log | head -n 30
              exit 1
            fi
          done
          grep -iE "BackupExclusionTests.*(passed|skipped)" xcodebuild.log
          # T-015: Keychain attributes, OSStatus mapping, store, lease, host errors.
          for t in testItemIsAfterFirstUnlockThisDeviceOnlyAndNotSynchronizable \
            testEveryQueryNamesServiceAndAccount testStatusMapping \
            testCreateThenReadReturnsTheSameKey testExistingKeyWinsOverANewCandidate \
            testDuplicateOnAddReturnsTheWinner testUnavailableIsRetriedThenReported \
            testCreateRefusesWhileTheStateIsUnknownOrUnusable testDegenerateCandidatesAreRefused \
            testFailedAddIsKeyStoreFailure testDeleteIsScopedAndIdempotent \
            testLeaseIsExclusiveUntilReleasedOrExpired testLeaseTimesOutWhileHeld \
            testHostErrorsCarryACodeOnly \
            testRenewExtendsAValidLease testRenewOfAnExpiredLeaseIsFalseAndDoesNotRevive \
            testRenewOfAStaleIdIsFalseAndLeavesTheCurrentLeaseAlone \
            testRenewAfterReleaseIsFalseAndNeverTakesTheLease testHostRenewIsTrueForTheCurrentLeaseOnly; do
            # xcodebuild can interleave lines, cutting a "passed" line; xcodebuild already exited 0, so require
            # that the test ran (its name appears) and that no line reports it failed.
            if ! grep -qiE "SecretStoreTests.*$t" xcodebuild.log || grep -qiE "test case.*SecretStoreTests.*$t.*failed" xcodebuild.log; then
              echo "::error::SecretStoreTests.$t did not pass"
              grep -iE "SecretStoreTests" xcodebuild.log | head -n 30
              exit 1
            fi
          done
          grep -iE "SecretStoreTests.*(passed|skipped)" xcodebuild.log
          # T-148: NFC rows shared with Kotlin and the Dart vectors; the backup key item.
          for t in testEverySharedRowNormalizesToItsNfcForm testDigitsSpacesAndCaseAreLeftAlone \
            testAWholeArabicPassphraseComposes testBackupKeyItemIsSeparateFromTheDatabaseKey; do
            if ! grep -qiE "TextNormalizationTests.*$t" xcodebuild.log || grep -qiE "test case.*TextNormalizationTests.*$t.*failed" xcodebuild.log; then
              echo "::error::TextNormalizationTests.$t did not pass"
              grep -iE "TextNormalizationTests" xcodebuild.log | head -n 30
              exit 1
            fi
          done

  android:
    name: android ${{ matrix.flavor }} (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flavor: devSms, mode: debug, env: dev, sms: true }
          - { flavor: devNoSms, mode: debug, env: dev, sms: false }
          - { flavor: stagingSms, mode: debug, env: staging, sms: true }
          - { flavor: stagingNoSms, mode: debug, env: staging, sms: false }
          - { flavor: prodSms, mode: release, env: prod, sms: true }
          - { flavor: prodNoSms, mode: release, env: prod, sms: false }
    env:
      FLAVOR: ${{ matrix.flavor }}
      MODE: ${{ matrix.mode }}
      APP_ENV: ${{ matrix.env }}
      EXPECT_SMS: ${{ matrix.sms }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get --enforce-lockfile
      - name: Build APK
        working-directory: app
        run: |
          if ! flutter build apk --"$MODE" --flavor "$FLAVOR" > build.log 2>&1; then
            echo "::error::build failed: $(grep -v -E 'Unzipping|^\[' build.log | grep -A25 -E 'What went wrong|Error|error:' | head -n 40 | tr '\n' '|')"
            exit 1
          fi
          tail -n 5 build.log
      # T-039: the instrumented suites (spool, guard, share) run only in the
      # opt-in sms-spike workflow; compiling their APK here catches source and
      # test-manifest errors on every push.
      - name: Build the instrumented test APK (devSms, T-039)
        if: matrix.flavor == 'devSms'
        working-directory: app/android
        run: |
          if ! ./gradlew --no-daemon :app:assembleDevSmsDebugAndroidTest > it-build.log 2>&1; then
            echo "::error::androidTest build failed: $(grep -A25 -E 'What went wrong|Error|error:|^e: ' it-build.log | head -n 40 | tr '\n' '|')"
            exit 1
          fi
          tail -n 3 it-build.log
      - name: Assert SMS permissions, applicationId and SDK levels
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          APK=$(find app/build/app/outputs -iname "*${FLAVOR}*${MODE}.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::APK for $FLAVOR ($MODE) not found: $(find app/build/app/outputs -name '*.apk' | tr '\n' ' ')"
            exit 1
          fi
          echo "APK: $APK"
          "$AAPT2" dump permissions "$APK" | tee perms.txt
          "$AAPT2" dump badging "$APK" > badging.txt
          grep -iE "^package:|sdkversion" badging.txt
          RESTRICTED="READ_SMS|RECEIVE_SMS|SEND_SMS|RECEIVE_MMS|RECEIVE_WAP_PUSH|READ_CELL_BROADCASTS"
          if [ "$EXPECT_SMS" = "false" ]; then
            if grep -E "android\.permission\.($RESTRICTED)" perms.txt; then
              echo "::error::$FLAVOR contains restricted SMS permissions: $(grep -E "android\.permission\.($RESTRICTED)" perms.txt | tr '\n' ' ')"
              exit 1
            fi
          else
            for p in READ_SMS RECEIVE_SMS; do
              if ! grep -q "android.permission.$p" perms.txt; then
                echo "::error::$FLAVOR is missing $p"
                exit 1
              fi
            done
          fi
          case "$APP_ENV" in
            prod) ID=app.zaghlol ;;
            *) ID="app.zaghlol.$APP_ENV" ;;
          esac
          if ! grep -q "package: name='$ID' " badging.txt; then
            echo "::error::applicationId is not $ID: $(grep -E '^package:' badging.txt)"
            exit 1
          fi
          if ! grep -qE "minSdkVersion:'26'" badging.txt; then
            echo "::error::minSdkVersion is not 26"
            exit 1
          fi
          if ! grep -qE "targetSdkVersion:'36'" badging.txt; then
            echo "::error::targetSdkVersion is not 36"
            exit 1
          fi
      # T-007: the sqlite3mc code asset ships for every ABI; release APKs are
      # 16 KB page-aligned (Play, targetSdk 35+) and contain no benchmark code.
      - name: Assert sqlite3mc code asset, 16 KB alignment, no benchmark code
        run: |
          APK=$(find app/build/app/outputs -iname "*${FLAVOR}*${MODE}.apk" | head -n 1)
          unzip -Z1 "$APK" | grep -E '^lib/' | sort > libs.txt
          cat libs.txt
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if ! grep -qE "^lib/$abi/lib[^/]*sqlite3[^/]*[.]so$" libs.txt; then
              echo "::error::no sqlite3 code asset for $abi in $APK"
              exit 1
            fi
          done
          if [ "$MODE" = "release" ]; then
            ZIPALIGN=$(ls -d "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -n 1)
            if ! "$ZIPALIGN" -c -P 16 -v 4 "$APK" > zipalign.log 2>&1; then
              grep -vE "\(OK" zipalign.log | tail -n 40
              echo "::error::$APK is not 16 KB page-aligned (zipalign -c -P 16)"
              exit 1
            fi
            grep -E "lib/.*[.]so" zipalign.log
            tail -n 1 zipalign.log
            for abi in arm64-v8a armeabi-v7a x86_64; do
              so="lib/$abi/libapp.so"
              if ! grep -qx "$so" libs.txt; then
                echo "::error::$so missing from $APK"
                exit 1
              fi
              if unzip -p "$APK" "$so" | grep -aqF ZAGHLOL_DB_BENCH; then
                echo "::error::benchmark code (ZAGHLOL_DB_BENCH) found in $so"
                exit 1
              fi
            done
          fi
      # T-165 (FR-SEC-05): on the final APK, backup is off and both rule files
      # exclude every domain for cloud backup and device-to-device transfer.
      - name: Assert no OS backup or device transfer
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          APK=$(find app/build/app/outputs -iname "*${FLAVOR}*${MODE}.apk" | head -n 1)
          bash .github/scripts/check-no-os-backup.sh "$AAPT2" "$APK"
      # T-008 (Q5) / T-040: every *Sms flavour has the production SmsReceiver
      # (BROADCAST_SMS), no *NoSms flavour has it or its class; spike code,
      # strings and the spike Guard base exist only in devSms. T-041: the ingestion worker (WorkManager) is in every
      # flavour, without DiagnosticsReceiver, foreground-service types or (in
      # release) androidx.test components.
      - name: Assert SMS receiver, spike and ingestion worker placement (T-008, T-040, T-041)
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          APK=$(find app/build/app/outputs -iname "*${FLAVOR}*${MODE}.apk" | head -n 1)
          bash .github/scripts/check-sms-spike-placement.sh "$AAPT2" "$APK" "$FLAVOR" "$MODE"
      # T-041 (design note section 7): the spike registry and marks are chosen
      # by a compile-time flavour constant, so AOT drops them from prod builds.
      - name: Assert no spike registry in prod libapp.so (T-041)
        if: matrix.mode == 'release'
        run: |
          APK=$(find app/build/app/outputs -iname "*${FLAVOR}*${MODE}.apk" | head -n 1)
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if unzip -p "$APK" "lib/$abi/libapp.so" | grep -aqF 5550100; then
              echo "::error::the synthetic spike sender 5550100 is in lib/$abi/libapp.so of $FLAVOR"
              exit 1
            fi
          done
          echo "$FLAVOR: no spike registry in libapp.so"

  ios:
    name: ios ${{ matrix.flavor }} (no codesign)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        flavor: [dev, staging, prod]
    env:
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Pin Xcode (reproducible simulator and toolchain)
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get --enforce-lockfile
      - name: Build iOS release
        working-directory: app
        run: |
          if ! flutter build ios --flavor "$FLAVOR" --no-codesign > build.log 2>&1; then
            echo "::error::ios build failed: $(grep -iE -B2 -A6 'error:|xcodebuild|schemes|configuration' build.log | head -n 40 | tr '\n' '|')"
            exit 1
          fi
          tail -n 5 build.log
