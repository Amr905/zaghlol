name: scratch-gen
on:
  push:
    branches: ['task/T-004-scratch']
permissions:
  contents: read
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: flutter pub get
      - run: |
          dart format app/pigeons
          tar czf - app/pigeons | base64 -w0 > out.b64
          echo "::notice title=size::$(wc -c < out.b64)"
          split -b 4000 -d out.b64 chunk.
      - run: |
          for n in 00 01 02 03 04 05 06 07; do
            if [ -f chunk.$n ]; then echo "::notice title=chunk$n::$(cat chunk.$n)"; fi
          done
