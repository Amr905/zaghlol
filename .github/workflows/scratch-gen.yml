name: scratch-gen
on:
  push:
    branches: ['task/T-004-scratch']
permissions:
  contents: read
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: flutter pub get 2>&1 | tail -5
      - run: |
          grep -A8 "^  pigeon:" pubspec.lock | while read l; do echo "::notice::lock $l"; done
      - run: |
          bash app/tool/generate_pigeon.sh 2>&1 | tail -20 | while read l; do echo "::notice::gen $l"; done
      - name: pack
        run: |
          tar czf - app/lib/core/platform app/android/app/src/main/kotlin/app/zaghlol/platform app/ios/Runner/Platform | base64 -w0 > out.b64
          echo "::notice title=size::$(wc -c < out.b64)"
          split -b 4000 -d out.b64 chunk.
      - name: g0
        run: |
          for n in 00 01 02 03 04 05 06 07; do
            if [ -f chunk.$n ]; then echo "::notice title=chunk$n::$(cat chunk.$n)"; fi
          done
      - name: g1
        run: |
          for n in 08 09 10 11 12 13 14 15; do
            if [ -f chunk.$n ]; then echo "::notice title=chunk$n::$(cat chunk.$n)"; fi
          done
      - name: g2
        run: |
          for n in 16 17 18 19 20 21 22 23; do
            if [ -f chunk.$n ]; then echo "::notice title=chunk$n::$(cat chunk.$n)"; fi
          done
      - name: g3
        run: |
          for n in 24 25 26 27 28 29 30 31; do
            if [ -f chunk.$n ]; then echo "::notice title=chunk$n::$(cat chunk.$n)"; fi
          done
