name: b52-digests
on:
  push:
    branches: ["ci/b52-digests"]
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(gh api repos/gitleaks/gitleaks/releases/latest --jq .tag_name); echo "TAG $V"
          V=${V#v}
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt" | grep -a "linux_x64" | sed 's/^/SUM /'
          curl -fsSL -o g.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"; sha256sum g.tgz | sed 's/^/ACTUAL /'
