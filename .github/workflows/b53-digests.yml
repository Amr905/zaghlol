name: b53-digests
on:
  push:
    branches: ["ci/B53-server-kit"]
    paths: [".github/workflows/b53-digests.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  digests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: sh backend/deploy/server/pin-images.sh | sed 's/^/PIN /'
