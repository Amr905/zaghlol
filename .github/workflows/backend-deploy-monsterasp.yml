name: backend-deploy-monsterasp

# MonsterASP.NET (IIS, one site) deployment, D-80 / T-206. Manual dispatch only.
# Runs only when the repository variable BACKEND_MONSTERASP_DEPLOY_ENABLED is `true`, and the job waits for the required reviewer of
# the GitHub environment `backend-production`. Runbook: docs/03-technical/deployment.md, "MonsterASP.NET + Aiven".
#
# Repository variables:   BACKEND_MONSTERASP_DEPLOY_ENABLED (true), BACKEND_SITE_URL (https://<site>.runasp.net or the custom domain)
# Environment `backend-production` secrets:
#   MONSTERASP_PUBLISH_URL   host and port of the Web Deploy endpoint from the publish profile, e.g. site1234.siteasp.net:8172
#   MONSTERASP_SITE          the site name in the publish profile (msdeploySite)
#   MONSTERASP_USER          the publish profile user name
#   MONSTERASP_PASSWORD      the publish profile password (no comma or double quote: msdeploy cannot parse them)
#   BACKEND_MIGRATOR_CONNECTION   Npgsql connection string of the `migrator` login on Aiven (used by the runner only, never written to the site)
#   BACKEND_APP_SETTINGS     the site's settings, one NAME=value per line (ConnectionStrings__App/Admin/Worker, Kms__Provider=HostSecrets,
#                            ZAGHLOL_KEYS__..., Catalog__Snapshots__BaseUrl, Purchases__..., Accounts__...). Written into web.config on
#                            the runner; never committed, never echoed.
# Order: build + unit tests -> publish win-x64 -> package check (no secrets) -> upload the package (rollback copy) -> migrate as
# migrator -> render web.config -> msdeploy sync (App_Data kept) -> smoke GET /v1/health.
# Rollback: dispatch again with rollback_run_id = the run id of an earlier successful deploy; it redeploys that run's package
# (no build, no migration) with the current secrets.
on:
  workflow_dispatch:
    inputs:
      rollback_run_id:
        description: "Optional run id of an earlier successful deploy of this workflow: redeploy its package (skips build and migration)."
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: backend-deploy-monsterasp
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  deploy:
    name: build, migrate, Web Deploy, smoke
    runs-on: windows-latest
    environment: backend-production
    timeout-minutes: 40
    env:
      ENABLED: ${{ vars.BACKEND_MONSTERASP_DEPLOY_ENABLED }}
      SITE_URL: ${{ vars.BACKEND_SITE_URL }}
      ROLLBACK_RUN_ID: ${{ inputs.rollback_run_id }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Refuse unless MonsterASP deploys are enabled and configured
        shell: bash
        env:
          S_URL: ${{ secrets.MONSTERASP_PUBLISH_URL }}
          S_SITE: ${{ secrets.MONSTERASP_SITE }}
          S_USER: ${{ secrets.MONSTERASP_USER }}
          S_PASSWORD: ${{ secrets.MONSTERASP_PASSWORD }}
          S_SETTINGS: ${{ secrets.BACKEND_APP_SETTINGS }}
          S_MIGRATOR: ${{ secrets.BACKEND_MIGRATOR_CONNECTION }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            echo "::error title=MonsterASP deploy disabled::Set the repository variable BACKEND_MONSTERASP_DEPLOY_ENABLED=true (docs/03-technical/deployment.md, MonsterASP.NET + Aiven)."
            exit 1
          fi
          case "$SITE_URL" in https://?*) ;; *) echo "::error title=Missing variable::BACKEND_SITE_URL must be the https:// site URL."; exit 1 ;; esac
          for v in S_URL S_SITE S_USER S_PASSWORD S_SETTINGS; do
            if [ -z "${!v}" ]; then echo "::error title=Missing secret::A required secret of the backend-production environment is empty (see the header of this workflow)."; exit 1; fi
          done
          if [ -z "$ROLLBACK_RUN_ID" ] && [ -z "$S_MIGRATOR" ]; then echo "::error title=Missing secret::BACKEND_MIGRATOR_CONNECTION is required for a normal deploy."; exit 1; fi
          case "$S_PASSWORD" in *,*|*\"*) echo "::error title=Publish password::MONSTERASP_PASSWORD contains a comma or double quote, which msdeploy cannot take. Reset it in the control panel."; exit 1 ;; esac
          case "$ROLLBACK_RUN_ID" in ""|*[!0-9]*) [ -z "$ROLLBACK_RUN_ID" ] || { echo "::error::rollback_run_id must be digits only."; exit 1; } ;; esac

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Build and unit tests (no Docker needed)
        if: ${{ inputs.rollback_run_id == '' }}
        shell: bash
        working-directory: backend
        run: |
          dotnet restore Zaghlol.sln
          dotnet build Zaghlol.sln -c Release --no-restore -warnaserror
          dotnet test tests/Zaghlol.Application.Tests -c Release --no-build
          dotnet test tests/Zaghlol.Workers.Tests -c Release --no-build
          dotnet test tests/Zaghlol.Api.Tests -c Release --no-build --filter "FullyQualifiedName~EmbeddedWorkersTests"

      - name: Publish the site (framework-dependent win-x64) and the migration tool
        if: ${{ inputs.rollback_run_id == '' }}
        shell: bash
        working-directory: backend
        run: |
          dotnet publish src/Zaghlol.Api/Zaghlol.Api.csproj -p:PublishProfile=MonsterAsp -c Release -o "$RUNNER_TEMP/package"
          dotnet publish src/Zaghlol.Workers/Zaghlol.Workers.csproj -c Release -r win-x64 --self-contained false -o "$RUNNER_TEMP/migrate"
          python -I deploy/monsterasp/monsterasp_package.py check "$RUNNER_TEMP/package"

      - name: Upload the package (kept 30 days: the rollback copy; holds no secrets)
        if: ${{ inputs.rollback_run_id == '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: monsterasp-package
          path: ${{ runner.temp }}/package
          retention-days: 30
          if-no-files-found: error

      - name: Download the package of the rollback run
        if: ${{ inputs.rollback_run_id != '' }}
        shell: bash
        run: |
          gh run download "$ROLLBACK_RUN_ID" --repo "$REPO" --name monsterasp-package --dir "$RUNNER_TEMP/package"
          python -I backend/deploy/monsterasp/monsterasp_package.py check "$RUNNER_TEMP/package"

      - name: Apply database migrations as the migrator login
        if: ${{ inputs.rollback_run_id == '' }}
        shell: bash
        env:
          ConnectionStrings__Migrator: ${{ secrets.BACKEND_MIGRATOR_CONNECTION }}
        run: dotnet "$RUNNER_TEMP/migrate/Zaghlol.Workers.dll" --migrate

      - name: Render web.config from the environment secret (values are not printed)
        shell: bash
        env:
          S_SETTINGS: ${{ secrets.BACKEND_APP_SETTINGS }}
        run: |
          umask 077
          printf '%s\n' "$S_SETTINGS" > "$RUNNER_TEMP/settings.env"
          printf 'Catalog__Snapshots__BaseUrl=%s\n' "${SITE_URL%/}" >> "$RUNNER_TEMP/settings.env"
          python -I backend/deploy/monsterasp/monsterasp_package.py render "$RUNNER_TEMP/package" "$RUNNER_TEMP/settings.env"
          rm -f "$RUNNER_TEMP/settings.env"

      - name: Make sure Web Deploy is installed
        shell: pwsh
        run: |
          $msdeploy = "${env:ProgramFiles(x86)}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          if (-not (Test-Path $msdeploy)) { choco install webdeploy -y --no-progress | Out-Null }
          if (-not (Test-Path $msdeploy)) { throw "msdeploy.exe not found after install" }

      - name: Web Deploy sync (App_Data and logs are kept)
        shell: pwsh
        env:
          MD_URL: ${{ secrets.MONSTERASP_PUBLISH_URL }}
          MD_SITE: ${{ secrets.MONSTERASP_SITE }}
          MD_USER: ${{ secrets.MONSTERASP_USER }}
          MD_PASSWORD: ${{ secrets.MONSTERASP_PASSWORD }}
        run: |
          $msdeploy = "${env:ProgramFiles(x86)}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          $source = Join-Path $env:RUNNER_TEMP 'package'
          $dest = "contentPath=$env:MD_SITE,computerName=https://$($env:MD_URL)/msdeploy.axd?site=$($env:MD_SITE),userName=$($env:MD_USER),password=$($env:MD_PASSWORD),authType=Basic"
          & $msdeploy "-verb:sync" "-source:contentPath=$source" "-dest:$dest" `
            "-enableRule:AppOffline" `
            "-skip:objectName=dirPath,absolutePath=.*\\App_Data($|\\.*)" `
            "-skip:objectName=filePath,absolutePath=.*\\App_Data\\.*" `
            "-skip:objectName=dirPath,absolutePath=.*\\logs($|\\.*)" `
            "-skip:objectName=filePath,absolutePath=.*\\logs\\.*" `
            "-verbose" 2>&1 | ForEach-Object { $_ -replace [regex]::Escape($env:MD_PASSWORD), '***' }
          if ($LASTEXITCODE -ne 0) { throw "msdeploy failed with exit code $LASTEXITCODE" }

      - name: Smoke test GET /v1/health
        shell: bash
        run: |
          base="${SITE_URL%/}"
          for i in $(seq 1 12); do
            if curl -fsS --max-time 30 "$base/v1/health" | tee health.json | grep -q '"status":"ok"'; then echo; echo "health ok"; exit 0; fi
            sleep 15
          done
          echo "::error title=Smoke test::/v1/health did not return status ok. Roll back: dispatch this workflow with rollback_run_id of the last good run."
          exit 1
