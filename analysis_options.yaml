# Shared analysis options for the whole workspace (app + packages).
# The zaghlol_lints rules (T-002) run via tools/lints/bin/zaghlol_lints.dart.
include: package:flutter_lints/flutter.yaml

# FU-029: riverpod_lint 3.x is an analyzer plugin (not custom_lint). Analyzer
# plugins are only read from the workspace root and are resolved by the analysis
# server itself, so riverpod_lint is not (and cannot be) in a pubspec: pigeon
# and zaghlol_lints pin analyzer <13. Results appear in `flutter analyze`.
plugins:
  riverpod_lint: ^3.2.0

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated/**"
    - "backend/**"
    - "docs/**"
    # T-016: scratch copies made by app/tool/generate_drift.sh.
    - "tools/drift_codegen/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
