# Shared analysis options for the whole workspace (app + packages).
# The zaghlol_lints rules (T-002) run via tools/lints/bin/zaghlol_lints.dart.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated/**"
    - "backend/**"
    - "docs/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
